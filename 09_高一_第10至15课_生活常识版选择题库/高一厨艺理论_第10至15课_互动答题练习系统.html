  <style>
    :root {

    /* Header & Navigation - Slim & Compact */

    /* Compact HUD Dashboard */
    .hud-bar {

    .hud-pill {
      display: flex;
      align-items: center;

    .reset-btn {

      box-shadow: var(--shadow-sm);
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);

    /* Search and Utility Bar */
    .utility-bar {
      display: flex;

    .action-btn {

      font-weight: 600;

    .q-header {

    .q-tag {

      font-weight: 700;

      border-radius: 8px;
      background: #FEF3C7;
      color: #92400E;

    .q-tag.roman {
      background: #EDE9FE;
      color: #6D28D9;
    }

    .q-chapter-badge {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .q-title {
      font-size: 1.25rem;
      font-weight: 700;

      color: #0F172A;
      margin-bottom: 22px;
      white-space: pre-line;
      letter-spacing: -0.2px;

    /* Options List - Large, High-Contrast & Interactive */
    .options-grid {

    .option-item {

      background: white;

      user-select: none;
      position: relative;
    }

    .option-item:hover:not(.locked) {
      border-color: #D97706;
      background: #FFFDF7;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.14);

    .option-item:active:not(.locked) {

    .opt-letter {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #F1F5F9;

      font-size: 1.2rem;
      margin-right: 18px;
      flex-shrink: 0;
      color: #475569;
      transition: all 0.2s ease;
    }

    .opt-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.5;
      flex: 1;
      color: #1E293B;
    }

    /* Option Selected States */
    .option-item.correct {
      border-color: #10B981;
      background: #F0FDF4;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.16);
    }

    .option-item.correct .opt-letter {
      background: #10B981;
      color: white;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.35);
    }

    .option-item.correct .opt-text {
      font-weight: 600;
      color: #065F46;
    }

    .option-item.wrong {
      border-color: #EF4444;
      background: #FEF2F2;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.16);
    }

    .option-item.wrong .opt-letter {
      background: #EF4444;
      color: white;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
    }

    .option-item.wrong .opt-text {
      font-weight: 600;
      color: #991B1B;
    }

    .option-item.should-have-chosen {
      border-color: #10B981;
      border-style: dashed;
      background: #F0FDF4;
    }

    .option-item.should-have-chosen .opt-letter {
      background: #ECFDF5;
      border: 2px solid #10B981;
      color: #10B981;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 22px;
      padding: 20px 24px;
      background: #F0F9FF;
      border-left: 5px solid #0284C7;
      border-radius: 12px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box.show {
      display: block;
    }

    .exp-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0369A1;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .exp-body {
      font-size: 1.05rem;
      color: #1E293B;
      line-height: 1.7;
    }



    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 8px 12px; }
      .brand-title { font-size: 1rem; }
      .brand-sub { display: none; }
      .hud-bar { padding: 2px 6px; gap: 4px; }
      .hud-pill { padding: 2px 6px; }
      .hud-label { font-size: 0.7rem; }
      .hud-value { font-size: 0.88rem; }
      .question-card { padding: 18px 20px; }
      .q-title { font-size: 1.12rem; }
      .option-item { min-height: 56px; padding: 12px 16px; }
      .opt-letter { width: 34px; height: 34px; font-size: 1.05rem; margin-right: 12px; }
      .opt-text { font-size: 1.02rem; }
    }
  </style>

  <header>
    <div class="header-container">
      <div class="nav-left">
        <div class="brand-title">
          <span>2026 UEC 高一烘焙精选题库</span>

  <main>
    <!-- Chapter Filter Tabs (Dynamically rendered from dataset) -->
    <div class="tabs-wrapper" id="chapterTabs"></div>

    <!-- Search & Utility -->
    <div class="utility-bar">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索考点或关键词（如：手套膜、黄油打发、蛋白霜、发酵温水...）">
      </div>
    </div>

    <!-- Questions Container -->
    <div id="questionsContainer"></div>

  <script>
    // Embedded Question Dataset (180 Questions)
    const rawData = [
    {
        "chapter_id":  10,
        "chapter_title":  "第10课｜面粉 (Flour)",
        "intro":  "高一厨艺理论基础：认识面粉分类、家庭常识、过筛要领与面团状态（生活常识版）",
        "questions":  [
                          {
                              "id":  1,
                              "type":  "single",
                              "question":  "在制作拉丝且高耸饱满的吐司面包（Toast Bread）时，通常首选哪种面粉？",
                              "options":  {
                                              "A":  "筋度高且骨架支撑力强的高筋面粉（Bread Flour）",
                                              "B":  "筋度低且口感松软易碎的低筋面粉（Cake Flour）",
                                              "C":  "筋度中等且适合做包子馒头的中筋面粉（All-Purpose）",
                                              "D":  "完全无面筋且仅用于勾芡增稠的玉米淀粉（Cornstarch）"
                                          },
                              "answer":  "A",
                              "explanation":  "吐司面包需要强韧的面筋网络来包裹发酵气体，高筋面粉蛋白质含量高，能揉出坚韧有弹性的薄膜支撑面包膨胀长高，是做面包的首选原料。"
                          },
                          {
                              "id":  2,
                              "type":  "single",
                              "question":  "制作入口即化的轻盈戚风蛋糕或酥脆曲奇饼干时，最适合选用的面粉是：",
                              "options":  {
                                              "A":  "吸水力极强且吃起来非常劲道有嚼劲的高筋面粉",
                                              "B":  "研磨粗糙且带有大量粗纤维麦麸颗粒的全麦面粉",
                                              "C":  "蛋白质含量低且不易起筋发硬的低筋面粉（Cake Flour）",
                                              "D":  "专门用于制作法式硬长棍面包的特高筋硬质小麦粉"
                                          },
                              "answer":  "C",
                              "explanation":  "蛋糕和曲奇追求轻盈松软或酥脆无韧性的口感，低筋面粉筋度最低，搅拌时最不容易产生强韧面筋，可以避免蛋糕烤出来硬得像发糕。"
                          },
                          {
                              "id":  3,
                              "type":  "single",
                              "difficulty":  "medium-high",
                              "question":  "在面团调制流变学中，赋予面团回弹弹性（Elasticity）与骨架韧性、依靠二硫键交联的小麦蛋白质成分是：",
                              "options":  {
                                              "A":  "水溶性良好且无骨架作用的清蛋白（Albumin）",
                                              "B":  "分子量巨大呈网状交联的麦谷蛋白（Glutenin）",
                                              "C":  "主要赋予面团流动延展性能的麦胶蛋白（Gliadin）",
                                              "D":  "耐高温且主要水解淀粉质的淀粉酶（Amylase）"
                                          },
                              "answer":  "B",
                              "explanation":  "小麦面筋主要由麦谷蛋白（Glutenin，提供弹性和韧性骨架）与麦胶蛋白（Gliadin，提供流动延展性）吸水结合而成。麦谷蛋白分子量巨大，通过分子间二硫键形成牢固三维网状骨架。"
                          },
                          {
                              "id":  4,
                              "type":  "single",
                              "question":  "家中长辈平时常用来包饺子、蒸馒头、烙大饼的普通面粉，在烘焙分类中通常对应：",
                              "options":  {
                                              "A":  "专门烘烤重油磅蛋糕的极低筋蛋糕粉",
                                              "B":  "完全去除了淀粉的小麦活性面筋粉",
                                              "C":  "完全不含面筋蛋白的澄粉与生淀粉",
                                              "D":  "蛋白质适中且用途广泛的中筋面粉"
                                          },
                              "answer":  "D",
                              "explanation":  "中筋面粉（蛋白质含量通常在9.5%~11.5%左右）用途最广，做出的中式面点既有一定嚼劲又不会过分坚硬，是家庭最常备的面粉。"
                          },
                          {
                              "id":  5,
                              "type":  "roman",
                              "question":  "关于烘焙中低筋面粉、中筋面粉与高筋面粉的日常认知，下列叙述哪些是正确的？\n  i. 制作生日蛋糕胚通常选用低筋面粉，以保持轻盈松软\n  ii. 制作有嚼劲的吐司面包通常选用高筋面粉，以形成面筋骨架\n  iii. 中筋面粉介于两者之间，常用于中式包子、馒头或家常面食\n  iv. 面粉中的蛋白质含量越高，其形成的湿面筋弹性通常越强",
                              "options":  {
                                              "A":  "仅 i、iv 项叙述正确",
                                              "B":  "i、ii、iii、iv 均正确",
                                              "C":  "仅 iii、iv 项叙述正确",
                                              "D":  "仅 ii、iii 项叙述正确"
                                          },
                              "answer":  "B",
                              "explanation":  "四项叙述完全符合烘焙基础理论：低筋做蛋糕、高筋做面包、中筋做中点家常面食，且蛋白质含量直接正相关于面筋形成强度。"
                          },
                          {
                              "id":  6,
                              "type":  "single",
                              "question":  "在混合蛋糕面糊前，配方步骤通常强烈要求将面粉用细筛网“过筛”，其核心作用是：",
                              "options":  {
                                              "A":  "筛除面粉结块并充入微量空气，使粉质蓬松更易拌匀",
                                              "B":  "将面粉颗粒筛得像食盐结晶一样大以增加面筋韧性",
                                              "C":  "在筛网物理摩擦中产生高温直接把面粉提前烤熟",
                                              "D":  "将面粉中所有的天然淀粉全部过滤掉只保留纯蛋白质"
                                          },
                              "answer":  "A",
                              "explanation":  "面粉在包装储存中容易受潮结成小粉疙瘩。过筛能打散结块、混入空气，让面粉变得蓬松细腻，拌入蛋糊时能迅速分散，不易消泡或形成面疙瘩。"
                          },
                          {
                              "id":  7,
                              "type":  "single",
                              "difficulty":  "medium-high",
                              "question":  "在商业吐司面包面团搅拌工艺中，将配方中的软化黄油加入搅拌缸中最理想的黄金工艺节点是：",
                              "options":  {
                                              "A":  "干粉与清水刚倒入搅拌缸中尚未开机运转搅拌时",
                                              "B":  "出炉切片前十分钟直接用毛刷均匀抹在面糊表面",
                                              "C":  "面团搅拌过度完全断筋瘫软发黏成稀烂糊状之后",
                                              "D":  "面团达到初步扩展阶段拉出厚膜且破口呈锯齿状时"
                                          },
                              "answer":  "D",
                              "explanation":  "后油法原理：油脂会在面粉颗粒表面形成油膜阻碍面筋吸水。必须待面筋搅拌至初步扩展阶段（形成6-7成筋度网状骨架）后再加入黄油，既不阻碍面筋形成，又能借助油脂润滑拉伸出坚韧半透明手套薄膜。"
                          },
                          {

                              "question":  "在面包酵母生产工艺学中，干酵母在真空包装或充氮包装密闭状态下，其细胞内部所保留的“结合水水分含量标准”通常严格控制在：",
                              "options":  {
                                              "A":  "大约百分之四至百分之六左右，既彻底阻止代谢变质又保持复水复活能力",
                                              "B":  "高达百分之八十以上，在常温包装袋中呈现完全流动的透明液体水浆状态",
                                              "C":  "必须达到百分之零点零零完全绝对干燥，哪怕有一个水分子活菌都会爆炸",
                                              "D":  "无论水分含量多高对干酵母常温储存期间的生理代谢酶活性完全没有任何影响"
                                          },
                              "answer":  "A",
                              "explanation":  "即发干酵母（Instant Active Dry Yeast）水分临界点控制极其苛刻：含水量过高（\u003e8%）会促使酵母自体呼吸消耗储备糖原（海藻糖），急剧缩短寿命；含水量过低（\u003c2%）则会破坏细胞膜结构导致水化时膜破裂死亡。严格控制在4%~6%配合海藻糖保护膜，可常温休眠保存2年。"
                          },
                          {
                              "id":  40,
                              "type":  "single",
                              "question":  "平时在厨房中，如果发现开封使用的干酵母粉在温水糖液中静置十五分钟后，完全没有任何气泡产生、水面死气沉沉且沉淀在碗底，最妥善的处理方式是：",
                              "options":  {
                                              "A":  "继续向死水碗中倒入两勺食盐搅拌，然后倒进三斤面粉中继续强行制作家庭吐司",
                                              "B":  "证实这包干酵母已经完全死绝失效，坚决彻底丢弃并开封一包全新保质期内干酵母",
                                              "C":  "在死水碗中加入大量高度白酒搅拌均匀，然后放入烤箱高温加热两小时食用",
                                              "D":  "把失效干酵母倒入面团中揉成面团后，放在零下二十度急冻三天即可自然复活"
                                          },
                              "answer":  "B",
                              "explanation":  "温水加糖15分钟无任何起泡发泡，是不容置疑的“酵母已死”铁证。继续使用必然导致昂贵的面粉、黄油、鸡蛋和数小时辛劳彻底化为死面疙瘩报废，必须果断淘汰扔掉，更换新鲜活跃的酵母使用。"
                          }
                      ]
    }
];

    // State
    let currentFilter = 'all';
    let searchQuery = '';
    let userAnswers = {}; // key: `ch-id`, value: { chosen: 'A', correct: true/false }

    // Flatten all questions
    let allQuestions = [];
    rawData.forEach(ch => {
      ch.questions.forEach(q => {
        allQuestions.push({
          chapter_id: ch.chapter_id,
          chapter_title: ch.chapter_title,
          uid: `${ch.chapter_id}-${q.id}`,
          ...q
        });
      });
    });

    // Render questions
    function render() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      let filtered = allQuestions.filter(q => {
        // Chapter filter
        if (currentFilter === 'mistakes') {
          const rec = userAnswers[q.uid];
          if (!rec || rec.correct) return false;
        } else if (currentFilter !== 'all') {
          if (q.chapter_id != currentFilter) return false;
        }

        // Search query
        if (searchQuery.trim() !== '') {
          const qText = (q.question + q.options.A + q.options.B + q.options.C + q.options.D + q.explanation).toLowerCase();
          if (!qText.includes(searchQuery.toLowerCase())) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 60px 20px; background:white; border-radius:12px; border:1px solid #E2E8F0;">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🎉</div>
            <h3 style="color:#334155; margin-bottom:6px;">没有找到匹配的题目</h3>
            <p style="color:#64748B; font-size:0.92rem;">${currentFilter === 'mistakes' ? '太棒了！目前还没有做错任何题目，或者错题已被清除。' : '试试调整搜索关键词或选择其他单元课。'}</p>
          </div>
        `;
        return;
      }

      filtered.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${q.uid}`;

        const isRoman = q.type === 'roman';
        const tagText = isRoman ? '乙组·罗马组合题' : '甲组·单项选择题';
        const tagClass = isRoman ? 'q-tag roman' : 'q-tag';

        const rec = userAnswers[q.uid];
        const isAnswered = !!rec;

        let optionsHtml = '';
        ['A', 'B', 'C', 'D'].forEach(letter => {
          let itemClass = 'option-item';
          if (isAnswered) {
            itemClass += ' locked';
            if (rec.chosen === letter) {
              itemClass += rec.correct ? ' correct' : ' wrong';
            } else if (!rec.correct && q.answer === letter) {
              itemClass += ' should-have-chosen';
            }
          }

          optionsHtml += `
            <div class="${itemClass}" onclick="handleOptionClick('${q.uid}', '${letter}')">
              <span class="opt-letter">${letter}</span>
              <span class="opt-text">${q.options[letter]}</span>
            </div>
          `;
        });

        const expShowClass = isAnswered ? 'explanation-box show' : 'explanation-box';

        let diffBadge = '';
        if (q.difficulty === 'easy') {
          diffBadge = '<span class="diff-tag" style="background:#DCFCE7; color:#15803D; font-size:0.75rem; padding:3px 8px; border-radius:6px; font-weight:700; margin-left:6px;">【容易】</span>';
        } else if (q.difficulty === 'medium') {
          diffBadge = '<span class="diff-tag" style="background:#FEF9C3; color:#A16207; font-size:0.75rem; padding:3px 8px; border-radius:6px; font-weight:700; margin-left:6px;">【中等】</span>';
        } else if (q.difficulty === 'hard') {
          diffBadge = '<span class="diff-tag" style="background:#FEE2E2; color:#B91C1C; font-size:0.75rem; padding:3px 8px; border-radius:6px; font-weight:700; margin-left:6px;">【较难】</span>';
        }

        card.innerHTML = `
          <div class="q-header">
            <div>
              <span class="${tagClass}">${tagText}</span>
              ${diffBadge}
            </div>
            <span class="q-chapter-badge">${q.chapter_title} · 第 ${q.id} 题</span>
          </div>
          <div class="q-title">${q.question}</div>
          <div class="options-grid">
            ${optionsHtml}
          </div>
          <div class="${expShowClass}" id="exp-${q.uid}">
            <div class="exp-title">💡 生活常识与烘焙机理解析【正确答案：${q.answer}】</div>
            <div class="exp-body">${q.explanation}</div>
          </div>
        `;

        container.appendChild(card);
      });

      updateHUD();
    }

    // Handle Option Selection
    window.handleOptionClick = function(uid, chosenLetter) {
      if (userAnswers[uid]) return; // already answered

      const q = allQuestions.find(item => item.uid === uid);
      if (!q) return;

      const isCorrect = (chosenLetter === q.answer);
      userAnswers[uid] = { chosen: chosenLetter, correct: isCorrect };

      render();
    };

    // Update HUD stats
    function updateHUD() {
      const answeredKeys = Object.keys(userAnswers);
      const answeredCount = answeredKeys.length;
      let correctCount = 0;
      answeredKeys.forEach(k => {
        if (userAnswers[k].correct) correctCount++;
      });
      const wrongCount = answeredCount - correctCount;
      const acc = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      document.getElementById('hudAnswered').innerText = `${answeredCount} / ${allQuestions.length}`;
      document.getElementById('hudAccuracy').innerText = `${acc}%`;
      document.getElementById('hudCorrect').innerText = correctCount;
      document.getElementById('hudWrong').innerText = wrongCount;
    }

    // Reset All
    window.resetAll = function() {
      if (confirm('确定要清空当前的做题记录重新开始吗？')) {
        userAnswers = {};
        render();
      }
    };

    // Dynamically Render Filter Tabs from Dataset
    function renderTabs() {
      const tabsWrapper = document.getElementById('chapterTabs');
      let html = `<button class="tab-btn active" data-chapter="all">🌟 全部题目 (${allQuestions.length}题)</button>`;
      rawData.forEach(ch => {
        const cleanTitle = ch.chapter_title.replace(/\s*\(.*\)/, '');
        html += `<button class="tab-btn" data-chapter="${ch.chapter_id}">${cleanTitle} (${ch.questions.length}题)</button>`;
      });
      html += `<button class="tab-btn" data-chapter="mistakes">⚠️ 错题专练</button>`;
      tabsWrapper.innerHTML = html;

      tabsWrapper.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          tabsWrapper.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.getAttribute('data-chapter');
          render();
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Initial render
    renderTabs();
    render();
  </script>
</body>
</html>
