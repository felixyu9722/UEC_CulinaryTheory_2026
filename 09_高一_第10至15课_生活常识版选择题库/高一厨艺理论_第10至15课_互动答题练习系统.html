  <script>
    // Embedded Question Dataset (180 Questions)
    const rawData = [{"chapter_id": 10, "chapter_title": "第10单元｜面粉 (Flour)", "intro": "高一厨艺理论基础：认识面粉分类、家庭常识、过筛要领与面团状态（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "制作吐司面包（Toast Bread）时，通常首选哪种面粉？", "options": {"A": "玉米淀粉", "B": "低筋面粉", "C": "中筋面粉", "D": "高筋面粉"}, "answer": "D", "explanation": "吐司面包需要强韧的面筋网络来包裹发酵气体，高筋面粉蛋白质含量高，能揉出坚韧有弹性的薄膜支撑面包膨胀长高，是做面包的首选原料。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "制作轻盈戚风蛋糕或酥脆曲奇饼干时，最适合选用的面粉是：", "options": {"A": "特高筋硬质小麦粉", "B": "全麦面粉", "C": "面包粉", "D": "低筋面粉"}, "answer": "D", "explanation": "蛋糕和曲奇追求轻盈松软或酥脆无韧性的口感，低筋面粉筋度最低，搅拌时最不容易产生强韧面筋，可以避免蛋糕烤出来硬得像发糕。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "赋予面团回弹弹性与骨架韧性、依靠二硫键交联的小麦蛋白质成分是：", "options": {"A": "清蛋白（Albumin）", "B": "麦胶蛋白（Gliadin）", "C": "麦谷蛋白（Glutenin）", "D": "淀粉酶（Amylase）"}, "answer": "C", "explanation": "小麦面筋主要由麦谷蛋白（Glutenin，提供弹性和韧性骨架）与麦胶蛋白（Gliadin，提供流动延展性）吸水结合而成。麦谷蛋白分子量巨大，通过分子间二硫键形成牢固三维网状骨架。"}, {"id": 4, "type": "single", "question": "日常制作包子、馒头或家常馅饼的面粉，在烘焙分类中对应：", "options": {"A": "特高筋面粉", "B": "澄粉", "C": "小麦淀粉", "D": "中筋面粉（All-Purpose Flour）"}, "answer": "D", "explanation": "中筋面粉（蛋白质含量通常在9.5%~11.5%左右）用途最广，做出的中式面点既有一定嚼劲又不会过分坚硬，是家庭最常备的面粉。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于面粉中面筋（Gluten）形成特性的叙述，下列哪些是正确的？
Ⅰ. 麦谷蛋白赋予面团弹性与韧性
Ⅱ. 麦胶蛋白赋予面团流动性与延展性
Ⅲ. 干粉状态下已存在完整立体网状面筋
Ⅳ. 加水并经机械搅拌，两蛋白交联形成面筋网", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "B", "explanation": "【考点解析】：面粉加水前仅存在游离的麦谷蛋白与醇溶蛋白，并不存在现成的面筋网架，必须经过吸水并施加机械搅拌外力，促使两者通过二硫键（Disulfide Bonds）紧密交联才形成三维网架面筋（Gluten），故Ⅲ错误；Ⅰ、Ⅱ、Ⅳ叙述完全准确。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "在混合蛋糕面糊前，配方通常要求将面粉“过筛”，其主要作用是：", "options": {"A": "筛除结块并充入空气，使粉质蓬松易拌匀", "B": "使颗粒粗大以增加韧性", "C": "摩擦生热提前熟化面粉", "D": "过滤去除全部淀粉"}, "answer": "A", "explanation": "面粉在包装储存中容易受潮结成小粉疙瘩。过筛能打散结块、混入空气，让面粉变得蓬松细腻，拌入蛋糊时能迅速分散，不易消泡或形成面疙瘩。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "在制作吐司面团时，将配方中的软化黄油加入搅拌缸的最佳时机是：", "options": {"A": "干粉与水刚倒入未开机时", "B": "出缸切块前一分钟", "C": "面筋完全断裂发黏后", "D": "面团搅拌至初步扩展阶段（面筋初成）"}, "answer": "D", "explanation": "后油法原理：油脂会在面粉颗粒表面形成油膜阻碍面筋吸水。必须待面筋搅拌至初步扩展阶段（形成6-7成筋度网状骨架）后再加入黄油，既不阻碍面筋形成，又能借助油脂润滑拉伸出坚韧半透明手套薄膜。"}, {"id": 8, "type": "single", "question": "制作轻盈海绵蛋糕时，若误用高筋面粉并长时间大力画圈搅拌，最易导致的失败现象是：", "options": {"A": "面糊液化流淌如水", "B": "无限制膨胀塞满烤箱", "C": "面糊严重消泡，出炉蛋糕质地硬实如发糕且塌陷", "D": "蛋糕完全分解为水蒸气"}, "answer": "C", "explanation": "高筋面粉筋度大，再加上过度画圈搅拌会促使面筋疯狂形成，使蛋糕面糊起筋发黏，烤出的蛋糕无法蓬松细腻，反而硬邦邦、富有韧性嚼劲，丧失蛋糕品质。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "小麦籽粒结构中，占整粒小麦重量约83%、主要提供淀粉和面筋蛋白的部位是：", "options": {"A": "麦麸（Bran）", "B": "胚芽（Germ）", "C": "糊粉层（Aleurone Layer）", "D": "胚乳（Endosperm）"}, "answer": "A", "explanation": "玉米淀粉完全不含面筋蛋白。中筋面粉与玉米淀粉按大约 4:1 的比例混合，稀释了整体蛋白质百分比，从而达到接近低筋面粉的低起筋特性。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "烘焙百分比（Baker's Percentage）中，永远被设定为基准 100% 的原料是：", "options": {"A": "水与液体总量", "B": "细砂糖总重量", "C": "面粉总重量", "D": "出炉面包净重"}, "answer": "D", "explanation": "面粉极易吸潮发霉和吸收周围异味，潮湿温热环境还容易生象鼻虫。因此开封后必须密封放入保鲜盒，存放在阴凉干燥避光处。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "法国烘焙面粉分级标准中，“T55面粉”数值“55”所指的科学含义是：", "options": {"A": "面筋延展长度为55mm", "B": "筛网孔径为55微米", "C": "每100克干物质燃烧后残留灰分约为0.55克", "D": "标准吸水率为55%"}, "answer": "C", "explanation": "灰分测定是将面粉在550℃~600℃高温下充分灼烧使有机物挥发完全，称量残留的无机矿物质重量。麦粒外层麸皮矿物质含量远高于胚乳中心，因此灰分是衡量面粉研磨精度、出粉率及纯净度的国际基准指标。"}, {"id": 12, "type": "single", "question": "全麦面粉相较于普通白面粉更容易酸败变质、保质期显著缩短，主要原因在于其含有：", "options": {"A": "极高浓度的食用食盐", "B": "富含不饱和脂肪酸与活性酶的胚芽与麸皮", "C": "超量双效泡打粉", "D": "过量的游离蔗糖"}, "answer": "B", "explanation": "抓一把新鲜面粉轻捏成团再散开是测试面粉湿度和筋度的正常物理手感，并不代表变质；发酸、发霉结块、生虫网则是绝对不可食用的变质特征。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "在制作面包调制面团时，通常高筋面粉的吸水率相较于低筋面粉：", "options": {"A": "高筋粉显著偏高（通常为60%~65%或更高）", "B": "完全相同无任何差异", "C": "高筋粉吸水率显著偏低", "D": "高筋粉完全不吸水"}, "answer": "B", "explanation": "【考点解析】：面粉过筛是纯物理机械分散过程，能消除结块、充入空气增加蓬松度、均一分散复配粉类，但绝不可能改变面粉分子的蛋白质化学结构或降低其筋度，故Ⅲ错误；Ⅰ、Ⅱ、Ⅳ正确。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "低筋面粉的蛋白质含量通常处于下列哪一标准范围？", "options": {"A": "14.0% ~ 16.0%", "B": "11.5% ~ 13.5%", "C": "7.0% ~ 9.0%", "D": "0% ~ 2.0%"}, "answer": "C", "explanation": "全麦面粉保留了整颗小麦的麸皮和胚芽，膳食纤维含量高、升糖慢，麦香味浓郁，但麸皮的物理切割作用会削弱面筋延展，因此全麦面包口感相对紧密有粗糙感。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "专业高筋面包粉的蛋白质含量通常处于下列哪一标准范围？", "options": {"A": "5.0% ~ 7.0%", "B": "11.5% ~ 13.5%（或以上）", "C": "20.0% ~ 25.0%", "D": "0%"}, "answer": "D", "explanation": "水质对烘焙面筋影响显著：适度硬水中的Ca2+和Mg2+能与小麦面筋蛋白上的酸性侧链结合形成盐桥（Salt Bridge），紧缩并强化面筋立体网状结构，提高耐搅拌性；过软的水则易使面团软塌发黏。"}, {"id": 16, "type": "single", "question": "面粉中的“灰分（Ash）”含量，主要用来衡量评定面粉的哪项品质指标？", "options": {"A": "出粉纯度与麦麸残留程度", "B": "面粉的甜度高低", "C": "面粉的含水量高低", "D": "面粉的白砂糖添加量"}, "answer": "B", "explanation": "面筋（Gluten）是面粉里的麦谷蛋白（弹性）和麦胶蛋白（延展性）在加水湿润后，通过外力揉捏挤压相互交织缠绕，形成的三维立体弹性网状结构。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "制作全麦欧包时，面团膨胀体积通常小于纯白高筋面包，其主要物理原因是：", "options": {"A": "全麦粉完全不含淀粉", "B": "坚硬的麸皮边缘在搅拌中切断割伤面筋网络，削弱保气能力", "C": "全麦粉中完全没有蛋白质", "D": "全麦粉彻底杀死了酵母菌"}, "answer": "C", "explanation": "低筋面粉颗粒细小、比表面积大、静电吸附和团聚性强，抓握后容易成团；高筋面粉颗粒较粗且较为松散滑爽，抓握松开后容易自行散开。这是后厨盲测面粉筋度的实用经验。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "在制作传统广式冰皮月饼或糯米滋时，常将糯米粉或面粉入锅炒熟作为“手粉”，主要目的是：", "options": {"A": "高温破坏面筋并使淀粉熟化，防粘且可直接食用", "B": "让生粉产生大量气泡", "C": "使手粉呈现深黑色", "D": "使冰皮在常温下融化"}, "answer": "A", "explanation": "把揉好的面团放在清水中反复揉搓漂洗，可溶于水的小麦淀粉被洗脱悬浮在水里（沉淀后即澄粉），最后留在手中那一团富有弹性拉不烂的胶状物就是纯面筋（纯蛋白质）。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "制作广式水晶虾饺或肠粉所使用的“澄粉（无筋面粉）”，其特点是：", "options": {"A": "富含极强韧高筋面筋", "B": "完全去除了面筋蛋白的小麦纯淀粉，熟化后晶莹剔透", "C": "全麦粗纤维粉", "D": "高油脂坚果粉末"}, "answer": "B", "explanation": "正常完整淀粉粒吸水量仅为其自身重量的30%~40%，而机械破损淀粉吸水率高达200%~300%，且极易受淀粉酶分解生成发酵糖。但破损淀粉过高会导致面团后期返水发黏，影响面包组织。"}, {"id": 20, "type": "single", "question": "在烘焙工坊中，面粉储存的最理想环境条件是：", "options": {"A": "高温高湿且阳光直射的户外", "B": "阴凉干燥、通风良好且离地离墙存放", "C": "直接堆放在潮湿水槽底下", "D": "密封泡在冷水水槽中"}, "answer": "D", "explanation": "潮湿温热是霉菌和仓储害虫繁殖的温床。受潮霉变的面粉可能产生强致癌的黄曲霉毒素，对人体肝脏危害极大，绝不能食用。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "在烘焙欧包制作中，“面粉自解法（Autolyse）”是指：", "options": {"A": "面粉加水混合后静置一段时间，让淀粉与蛋白质自然充分水合", "B": "将面团放入微波炉高温加热", "C": "直接向干面粉中喷洒酒精", "D": "将干粉放入搅拌机高速干磨"}, "answer": "A", "explanation": "【考点解析】：制作酥脆派皮、挞皮（Tart Crust）追求酥松化渣口感，必须极力抑制面筋生成，通常采用冷油搓沙法轻柔拌合，严禁强力长时间搅打（否则会导致起筋回缩、变硬发韧），故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ均属经典面筋调控准则。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "制作法式泡芙面糊时，将面粉倒入沸腾黄油水中翻炒“烫熟”，主要目的是：", "options": {"A": "破坏所有营养成分", "B": "使淀粉糊化吸水，形成能包裹空气与蒸汽的高黏弹性面糊", "C": "使面粉产生焦炭风味", "D": "使油水分离以便挤出"}, "answer": "B", "explanation": "泡芙膨胀靠水汽爆发。烫面使淀粉在高温下糊化，吸收大量水分，从而调制出具有黏弹性的面糊，烘烤时水分剧烈汽化顶起中空大肚皮，冷却后外脆内空。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "在面包面团搅拌进程中，面筋完全扩展、表面干爽光滑并能撑出手套膜的阶段是：", "options": {"A": "拾起阶段（水合阶段）", "B": "卷起阶段（初步成团）", "C": "完全扩展阶段（Final Stage）", "D": "过度搅拌断筋阶段"}, "answer": "A", "explanation": "泽列尼沉降值（Zeleny Value）是将面粉在含异丙醇与乳酸溶液中搅拌悬浮，测定沉淀液体积。沉降值越高，说明麦谷蛋白含量高、膨胀度好、面筋筋力强，是评价强筋小麦的国际标准。"}, {"id": 24, "type": "single", "question": "制作英式派皮或司康时采用的“搓沙法（Rub-in / Sablage）”，操作要点是：", "options": {"A": "将冰冷黄油丁与干面粉搓切成细小颗粒，减少起筋并利于分层酥松", "B": "将热黄油与面粉熬煮成浓汤", "C": "将干粉与冰水高速打发成泡沫", "D": "将黄油彻底融化后与面粉揉成强韧面团"}, "answer": "C", "explanation": "千层酥皮原理：面团（提供面筋支撑）与片状黄油（提供物理隔离）层层叠叠。烘烤时黄油中的水分汽化产生向上推力，受面筋皮阻隔无法散逸，从而将一层层面皮顶起形成千层酥脆。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "在面粉物理指标测定中，100g面粉洗出的“湿面筋”与烘干后的“干面筋”，两者重量比通常约为：", "options": {"A": "约 3 : 1", "B": "约 1 : 1", "C": "约 10 : 1", "D": "约 1 : 5"}, "answer": "B", "explanation": "灰分是面粉在高温马弗炉彻底焚烧后的矿物质残留。麦麸所含矿物质远高于麦心胚乳，灰分越低说明去除麸皮越干净、研磨越精细（如法国T45灰分低于T65）。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "面粉品质分析中，利用乳酸发酵液测定的“沉降值（Zeleny Value）”，主要反映：", "options": {"A": "面筋蛋白质的质量与烘焙烘力强弱", "B": "面粉的食盐纯度", "C": "面粉的色素含量", "D": "面粉的含油量"}, "answer": "D", "explanation": "自发面粉（Self-raising Flour）是在普通中筋粉中预先添加了适量化学泡打粉和微量盐，遇水受热即可释放二氧化碳膨胀，常用于做松饼、快速发糕等快手点心。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "使用粉质仪（Farinograph）测定面团流变学特性时，“稳定时间（Stability Time）”越长，说明：", "options": {"A": "面粉耐受机械搅拌抗破坏能力越强，筋力越优质", "B": "面粉越劣质无法成型", "C": "面团出缸水分蒸发越快", "D": "搅拌叶片磨损越严重"}, "answer": "A", "explanation": "粉质仪记录面团从加水开始到峰值及软化的全过程。稳定时间（Stability Time）越长，说明面粉耐受机械搅拌抗破坏的能力越强，属于高品质面包专用强筋粉的显著标志。"}, {"id": 28, "type": "single", "question": "制作法式马卡龙等高级西点加入杏仁粉时，常要求杏仁粉与糖粉或面粉一同过筛，主要原因是：", "options": {"A": "把杏仁粉打碎成液体", "B": "将杏仁粉中油脂全部挤出", "C": "借助干燥粉粒的阻隔分散作用，帮助高油脂杏仁粉顺畅过筛防结块", "D": "通过摩擦提前烤熟杏仁粉"}, "answer": "C", "explanation": "纯坚果粉（如杏仁粉）油脂高，单独过筛容易出油结块粘在网眼上；与干燥的面粉或糖粉混合后过筛，粉粒充当“干爽研磨介质”，能轻松穿过筛网且混合均匀。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "在面团调制中，过量添加下列哪种原料会严重削弱面筋形成、降低弹性和支撑力？", "options": {"A": "高筋面粉", "B": "食盐（适量）", "C": "高比例油脂与细砂糖", "D": "冷水"}, "answer": "A", "explanation": "【考点解析】：全麦粉因麦麸机械切割面筋及稀释面筋浓度，持气能力较弱，成品体积往往比纯白高筋面包更紧实低矮，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ完全符合全麦烘焙物理与储藏特性。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "制作面包时，判断面团达到“完全扩展阶段（手套膜）”的直观标准是：", "options": {"A": "取小块面团慢慢拉开，能撑出薄如蝉翼、破洞边缘平整光滑的半透明薄膜", "B": "面团完全摊开如水流动", "C": "表面干燥粗糙一拉即断", "D": "敲击面团发出坚硬声响"}, "answer": "A", "explanation": "完全扩展阶段（Final/Windowpane Stage）的面筋经充分延展，能撑出极薄且有韧性的半透明手套薄膜；用手指戳破小洞，破洞边缘光滑平整圆润，代表面筋网络达到最佳成熟度。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "欧洲烘焙标准中，法国T45、T55、T65面粉划分的核心依据是：", "options": {"A": "面粉颜色添加剂浓度", "B": "面筋韧性拉伸长度", "C": "矿物质灰分（Ash）含量的高低", "D": "面粉颗粒目数大小"}, "answer": "C", "explanation": "法国以灰分（Ash）定级：T代表Type，数值为100g干物灰分克数乘100。T45约为0.45%灰分（精白糕点粉），T55约为0.55%（法棍标准粉），T65约为0.65%，T150为全麦粉。"}, {"id": 32, "type": "single", "question": "在蛋糕面糊制作中，所谓“面糊消泡”通常与面粉加入后的哪种错误操作直接相关？", "options": {"A": "面粉预先经过充分过筛充气", "B": "加入面粉后大力、快速且长时间顺时针画圈搅拌", "C": "使用硅胶刮刀轻柔自底部翻拌", "D": "准确称量面粉用量"}, "answer": "B", "explanation": "打发的全蛋或蛋白霜极其娇嫩，气泡全靠薄弱蛋白膜包裹。加入面粉后大力画圈剧烈搅拌，不仅会快速破坏微小气泡导致面糊迅速变稀消泡，还会使面粉起筋导致蛋糕组织硬韧。", "difficulty": "easy"}, {"id": 33, "type": "single", "question": "制作广式水晶虾饺的“澄粉”，其本质化学成分主要是：", "options": {"A": "小麦粗纤维素", "B": "湿面筋蛋白凝胶", "C": "洁白纯净的小麦淀粉（Wheat Starch）", "D": "全麦麸皮粉"}, "answer": "C", "explanation": "澄粉（Wheat Starch）就是去除了面筋的小麦纯淀粉。加沸水烫熟后会呈现半透明水晶质感，是制作广式水晶虾饺、肠粉等高透明度中点必不可少的原料。", "difficulty": "easy"}, {"id": 34, "type": "single", "question": "在烘焙制作中，称量面粉必须使用电子秤而严禁使用普通饭碗随手舀取，原因在于：", "options": {"A": "粉类松散与压实容积差异大，碗舀误差可达30%以上，导致面团过干或过软", "B": "面粉会与瓷碗发生剧烈化学反应", "C": "烤箱会自动平衡误差", "D": "蛋白质会自发变色"}, "answer": "A", "explanation": "烘焙是一门精密科学。面粉具有压实度差异（压实与蓬松时体积重量差异可达30%以上），用碗或量勺舀取误差极大，只有使用精确到0.1g的电子秤称重才能保证水粉比例和发酵稳定。", "difficulty": "easy"}, {"id": 35, "type": "single", "difficulty": "medium", "question": "根据烘焙百分比计算规范，当配方中高筋粉为800g、低筋粉为200g时，计算基准面粉总重量为：", "options": {"A": "800克", "B": "200克", "C": "1000克（设定为基准 100%）", "D": "600克"}, "answer": "D", "explanation": "烘焙百分比（Baker's Percentage）的铁律是永远以面粉总重量为100%。其他所有原料（如水65%、酵母1%、盐1.5%、糖8%）均以对应面粉总量的百分比进行换算，方便后厨配方自由缩放。"}, {"id": 36, "type": "single", "question": "制作司康或英式派皮时，将冷藏黄油与面粉混合切拌成“粗玉米粉状”，其核心机理是：", "options": {"A": "使面粉完全受热熟化", "B": "微小黄油粒包裹面粉阻隔过度起筋，并在烘烤融化时形成酥松分层", "C": "将面团水分彻底吸干使成品坚硬", "D": "使面团能像吐司一样拉出长丝"}, "answer": "B", "explanation": "这是搓沙法（Sablage/Rub-in）：硬黄油被切碎成米粒大小包裹在干粉中，一方面限制了面粉与水分接触防止起筋发韧；另一方面烘烤时黄油颗粒融化留出空隙、内部水分蒸发，产生酥松起伏的碎屑酥脆感。", "difficulty": "medium"}, {"id": 37, "type": "combination", "question": "制作甜塔皮时，为防止烘烤时底部鼓起，常采用盲烤（Blind Baking），其操作是：", "options": {"A": "将塔皮直接丢入冷水中浸泡", "B": "在塔皮底部用叉子戳小孔，铺油纸压上烘焙陶瓷重石烘烤", "C": "在塔皮表面刷厚层胶水", "D": "使用大火直接油炸塔皮"}, "answer": "A", "explanation": "【考点解析】：梅雨季或高湿环境下，面粉自身已吸收空气中多余环境水分，含水量上升，因此后厨打面时必须酌情扣减 2%~5% 液体用量，否则面团极易软烂粘手，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ叙述完全正确。", "difficulty": "medium"}, {"id": 38, "type": "single", "question": "烘焙轻盈松软的蛋糕时，若配方要求低筋粉而误用了特高筋面包粉，成品通常会：", "options": {"A": "在烤箱中分解蒸发", "B": "比低筋粉烤出的更加入口即化", "C": "表面呈荧光绿色", "D": "面筋过度生成致组织紧密有嚼劲，失去轻软质感且易缩腰塌陷"}, "answer": "D", "explanation": "高筋面粉蛋白质过高，搅拌时面筋网迅速生成，阻碍蛋糊膨胀并形成橡胶般有嚼劲的硬骨架，出炉后因面筋收缩塌陷回缩，蛋糕硬邦邦、毫无松软口感。", "difficulty": "medium"}, {"id": 39, "type": "single", "difficulty": "hard", "question": "刚新收割小麦磨出的“新磨面粉”通常不宜立即投入面包生产，主要科学原因是：", "options": {"A": "新面粉会腐蚀不锈钢烤盘", "B": "游离巯基（-SH）过高，破坏二硫键导致面团发黏且易软化塌陷", "C": "淀粉无法被酵母分解", "D": "新面粉存在放射性衰变"}, "answer": "B", "explanation": "新磨面粉被称为“绿面粉（Green Flour）”，含有较多还原性巯基（-SH），会打断二硫键（-S-S-）导致面团无弹性、湿黏、塌陷无力。经过1~2周自然氧化陈化（或添加氧化剂），巯基被氧化结合为稳固二硫键，面筋筋力才能达到最佳状态。"}, {"id": 40, "type": "single", "question": "平时在厨房中，如果发现开封的面粉包装袋内部出现了丝状织网甚至有小黑甲虫在蠕动，正确的处理方式是：", "options": {"A": "过筛后继续烤蛋糕给家人食用", "B": "阳光暴晒后继续使用", "C": "整袋密封丢弃不再食用，并彻底清理消毒储存柜防交叉污染", "D": "两百度高温烘烤杀死成虫后使用"}, "answer": "C", "explanation": "生虫的面粉内部已经布满肉眼难见的虫卵、排泄物及分泌物，并伴有严重的细菌和霉菌滋生，即便把大虫筛掉也存在食品安全隐患，必须果断丢弃并清理橱柜。", "difficulty": "easy"}]}, {"chapter_id": 11, "chapter_title": "第11单元｜油脂 (Fats & Oils)", "intro": "高一厨艺理论基础：认识烘焙油脂种类、打发充气、起酥原理与储存常识（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "在西点烘焙中，制作高档曲奇饼干或法式牛角包首选的天然无盐黄油（Butter），主要提取自：", "options": {"A": "大豆植物油", "B": "优质新鲜牛奶的天然乳脂（Milk Fat）", "C": "深海粗盐提取物", "D": "氢化棕榈油"}, "answer": "D", "explanation": "天然黄油（Butter）是从牛奶中提炼的乳脂肪，熔点约在 28℃~34℃ 之间，恰好低于人体口腔温度（37℃），因此含在口中会迅速融化，带来独特的浓郁奶香与丝滑口感。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "制作可颂或千层酥皮时，若选用起酥油或片状黄油，其理想熔点通常为：", "options": {"A": "80℃以上高熔点", "B": "34℃ ~ 38℃（略高于体温，延展性佳且不油腻）", "C": "0℃以下冷冻熔点", "D": "100℃沸水熔点"}, "answer": "B", "explanation": "戚风蛋糕追求冷藏后依然柔软湿润。固态黄油或猪油放进冰箱会凝固变硬，而液体植物色拉油（如玉米油、芥花油）即使冷藏也保持液态，使蛋糕保持蓬松湿润。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "起酥油（Shortening）在饼干面团中包裹面筋、阻碍面筋形成强韧网络的特性，称为：", "options": {"A": "起酥性（Shortening Value）", "B": "发酵产气性", "C": "焦糖化特性", "D": "酶解特性"}, "answer": "B", "explanation": "开酥黄油的核心是“塑性区间（Plastic Range）”，通常在14℃~18℃最佳。温度过低黄油会脆裂碎成硬块刺破面皮；温度过高黄油融化渗入面团无法形成清晰酥层。"}, {"id": 4, "type": "single", "question": "制作轻盈松软的戚风蛋糕时，配方中通常选用液态植物油（如玉米油），主要原因在于：", "options": {"A": "高温烘烤会自发燃烧", "B": "常温呈流动液态，冷藏不凝固结硬，赋予蛋糕湿润轻盈口感", "C": "能完全替代打发蛋白", "D": "能完全去除面粉中的淀粉"}, "answer": "D", "explanation": "黄油具有良好的打发充气性（Creaming Property）。与细砂糖摩擦搅打能包裹进无数微小空气泡，烤箱受热时气泡膨胀，使曲奇饼干酥松化口。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于烘焙油脂在烘焙制品中作用的叙述，下列哪些是正确的？
Ⅰ. 润滑面筋，使成品柔软细腻
Ⅱ. 打发黄油包裹空气，提供膨发作用
Ⅲ. 延缓淀粉老化回生，延长保质期
Ⅳ. 油脂熔化后完全转化为水蒸气", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "A", "explanation": "【考点解析】：动物黄油熔点低且可塑温度范围窄（最佳延展温度为 15℃~18℃），冷冻状态下黄油质地坚硬发脆，直接擀压必然发生碎裂断层并刺穿面皮，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ叙述准确。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "黄油在打发（Creaming）过程中由黄色变为浅乳白色、体积显著膨大，主要是因为：", "options": {"A": "黄油高速搅打包裹并截留了大量细微空气微孔", "B": "黄油吸收了大量水分", "C": "黄油中的脂肪发生化学反应变白", "D": "黄油完全挥发消失"}, "answer": "C", "explanation": "猪油（Lard）的晶体结构特殊（以β'晶型为主），在室温下具有极宽的塑性范围，起酥性（Shortening Power）在所有常规油脂中名列前茅，能隔离面团形成轻薄酥层。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "天然动物黄油在室温下入口即化、没有糊口油腻感，是因为其融化温度：", "options": {"A": "高达60度以上", "B": "接近人体口腔体温（约28℃~34℃）", "C": "在零下十度以下", "D": "在100度开水以上"}, "answer": "D", "explanation": "面糊比重 = 同体积面糊重量 / 同体积水重量。磅蛋糕通过黄油充气包裹空气，优质面糊充气充分，比重通常在0.40~0.48左右。比重过大（>0.6）说明充气不足蛋糕紧密；比重过小则孔洞粗糙易塌陷。"}, {"id": 8, "type": "single", "question": "相较于人造植物奶油，天然动物黄油在健康与营养上的显著优势在于：", "options": {"A": "含天然乳脂风味，不含工业氢化产生的反式脂肪酸（Trans Fat）", "B": "不含任何热量与卡路里", "C": "完全可以生吃不必消毒", "D": "价格接近免费"}, "answer": "C", "explanation": "理想软化温度在 20℃ 左右，黄油保持固态但具备膏状延展性，手指轻按凹陷但不出水化油。若软化过度化为液体油，微小结晶被破坏，打发时无法包裹住空气。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "传统中式点心（如苏式月饼、蛋黄酥）制作中，起酥分层效果最显著的传统油脂是：", "options": {"A": "纯猪油（Lard）", "B": "纯植物大豆油", "C": "低度起酥油", "D": "变性淀粉糖浆"}, "answer": "B", "explanation": "曲奇花纹依赖打发黄油内部无数微细气孔和固态脂肪支撑。若融化成液态油，面糊失去充气骨架，进烤箱受热油流淌摊开，花纹彻底消失，烤出的曲奇扁平硬脆像煎饼。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "“澄清黄油（Clarified Butter / Ghee）”是指将黄油加热融化后，去除了哪部分成分得到的纯乳脂？", "options": {"A": "去除了浮沫乳清蛋白与底部沉淀水分，保留纯脂肪", "B": "去除了所有油脂保留纯水分", "C": "去除了所有天然香气", "D": "去除了所有维生素"}, "answer": "C", "explanation": "油脂中的不饱和脂肪酸暴露在氧气、光照和高温下会发生自动氧化，生成过氧化物并分解出低级醛、酮、酸，产生刺鼻恶臭的哈喇味（氧化酸败），酸败油脂不仅破坏风味且有害健康。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "制作法式费南雪蛋糕时使用的“焦化黄油（榛果黄油）”，其浓郁坚果风味来源于：", "options": {"A": "加入坚果香精人工调配", "B": "黄油中的乳固体在加热过程中发生的美拉德褐变反应", "C": "黄油烧焦碳化变黑", "D": "黄油在明火中燃烧"}, "answer": "C", "explanation": "烟点（Smoke Point）是油脂加热时挥发物与甘油分解产物（如丙烯醛）开始持续释放青烟的临界温度。一旦超过烟点，油脂开始热分解并产生致癌物质。精炼植物油烟点高（>210℃），而未精炼黄油烟点低（约150℃~170℃）。"}, {"id": 12, "type": "single", "question": "在面包面团调制中，油脂属于“柔性材料”，其作用机理是：", "options": {"A": "包裹在面筋和淀粉颗粒表面，阻碍面筋过度紧密交联，改善面包柔软度", "B": "促使面筋剧烈收缩变硬", "C": "杀死面团中的所有酵母", "D": "吸收面团中所有的水分"}, "answer": "D", "explanation": "油脂是柔性原料，起润滑面筋、保持水分、延缓老化和增添风味作用；二氧化碳气体全靠酵母菌发酵或化学膨松剂产生，油脂绝不可能代替酵母产气。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "如果在海绵蛋糕配方中盲目过量增加油脂比例，最常见的烘烤失败缺陷是：", "options": {"A": "蛋糕膨胀十倍高耸入云", "B": "油脂过量加重面糊负担并消泡，面筋骨架瘫软导致出炉严重塌陷回缩", "C": "蛋糕表皮变为透明玻璃状", "D": "蛋糕出炉后变成硬铁块"}, "answer": "A", "explanation": "【考点解析】：油脂是纯疏水性物质，根本无法促使淀粉糊化或面筋水合，烘焙必须依赖水作为水合介质，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ为油脂在烘焙中的三大核心功能。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "天然动物黄油日常保存必须密封并置于冷藏室（0℃~4℃），主要防止其：", "options": {"A": "吸收空气异味与光热氧化酸败变质", "B": "自发膨胀把冰箱撑破", "C": "在常温下转化为纯酒精", "D": "变成干燥粉末"}, "answer": "C", "explanation": "烘焙油脂具有防粘性（Anti-sticking）。抹油或喷脱模油能在模具表面形成一层疏水保护层，面团受热时蛋白质和淀粉不会粘附在金属上，出炉轻轻一倒即可完整脱模。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "油脂加热时开始冒出连续青烟的最低温度，在烹饪化学中称为油脂的：", "options": {"A": "冰点", "B": "沸点", "C": "烟点（Smoke Point）", "D": "等电点"}, "answer": "B", "explanation": "油脂同质多晶性：α晶型不稳定易转化；β型颗粒粗大砂粒感强（如纯可可脂凝固后）；β'（Beta-prime）晶型最为细小均匀，表面能包裹更多微气泡，赋予极佳涂抹塑性与充气能力。"}, {"id": 16, "type": "single", "question": "固体油脂在特定温度范围内既能保持形状又可受外力塑形延展的特性，称为油脂的：", "options": {"A": "可塑性（Plasticity）", "B": "挥发性", "C": "水溶性", "D": "放射性"}, "answer": "B", "explanation": "烘焙用液体油讲究“无色无味”。色拉油、玉米油、葵花籽油几乎没有气味，不影响西点天然奶蛋风味；花生油、芝麻油、初榨橄榄油风味过重，烤出的蛋糕味道怪异难以下咽。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "在乳化液微观结构中，天然黄油（含水约16%）属于下列哪种乳化体系？", "options": {"A": "水包油型（O/W型）", "B": "油包水型（W/O型）", "C": "气包水型", "D": "固包气型"}, "answer": "D", "explanation": "后油法原理：油脂具有强疏水性，若一开始就和干粉、水混在一起，油膜包裹面粉阻隔水分子渗入蛋白质，极大延缓面筋形成。因此后厨通常先让水粉搅拌至初步出筋，再加入黄油揉匀。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "制作司康或美式派皮时，要求黄油必须保持冰冷坚硬并切小粒，主要目的是：", "options": {"A": "让黄油在烘烤融化时留下空隙形成酥脆层次，防止过度起筋", "B": "把黄油冻结成冰块以防融化", "C": "使面粉完全失去吸水能力", "D": "让面皮呈现绿色"}, "answer": "D", "explanation": "黄油极易吸收周围气味（吸味性极强），且暴露在空气和光照下易氧化变质。开封后必须用铝箔或密封盒封好，放入 0℃~4℃ 冷藏室，远离葱蒜等强烈异味食材。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "在制作重油磅蛋糕时，液态植物油无法替代固态黄油进行打发，其原因是：", "options": {"A": "液态植物油完全不含脂肪", "B": "液态油缺乏晶体网状结构与可塑性，无法包裹并保留空气微泡", "C": "液态植物油价格昂贵", "D": "液态油会腐蚀打蛋器"}, "answer": "B", "explanation": "酸价（Acid Value，AV）表示中和1g油脂中游离脂肪酸所需的KOH毫克数。酸价越低，说明油脂水解程度小、越新鲜；酸价过高表明油脂已水解酸败产生大量游离酸，不得用于食品加工。"}, {"id": 20, "type": "single", "question": "操作黄油打发或软化时，黄油最适宜打发的操作温度（室温回软温度）通常为：", "options": {"A": "0℃以下冷冻硬块", "B": "18℃ ~ 22℃（手指可轻松压出凹坑且不化水）", "C": "60℃完全化成液体油", "D": "100℃滚烫开水温度"}, "answer": "C", "explanation": "起酥的本质是“阻断面筋连续性”。油脂包裹面粉颗粒，限制了面粉与水结合，将坚韧的长面筋网剪断、弱化为短小片段，烘烤后成品失去强韧性，变得酥松易碎、落屑化口。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "油脂在长期暴露于光照、氧气与潮湿环境中产生令人不适的“哈喇味”，主要是发生了：", "options": {"A": "油脂自动氧化酸败（Rancidity）", "B": "蛋白质水解发酵", "C": "淀粉酶解反应", "D": "美拉德反应"}, "answer": "A", "explanation": "【考点解析】：可颂开酥面团最终发酵温度绝不可超过黄油熔点（一般严控在 26℃~28℃ 以下），若置于 45℃ 极易导致包覆黄油全部化油流出，造成成品层次荡然无存且满盘积油，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ为开酥黄金法则。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "制作法式牛角包（Croissant）开酥擀压时，片状黄油与面团软硬度必须保持一致，否则：", "options": {"A": "黄油过硬会断裂破皮，过软会融化混酥，层次彻底破坏", "B": "烤箱会自动报警停机", "C": "面团会瞬间蒸发消失", "D": "面团甜度会增加十倍"}, "answer": "B", "explanation": "玉米油、大豆油等植物油常温下分子链不饱和度高，呈流动液态，不具备固态脂肪的结晶网络，因此无法单独通过搅打包裹空气，主要用于提供湿润度和柔韧性。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "评价烘焙专用油脂在不同温度下固体与液体脂肪比例的指标是：", "options": {"A": "固体脂肪指数（SFI / SFC）", "B": "水分活度（Aw）", "C": "灰分含量", "D": "面筋沉降值"}, "answer": "D", "explanation": "可可脂是巧克力的灵魂，其脂肪酸组成非常均一，固态脂肪含量在32℃~35℃之间呈断崖式下跌。这使得巧克力在室温硬脆有光泽、掰开有脆响（Snap），一放入口中瞬间融化丝滑无渣。"}, {"id": 24, "type": "single", "question": "工业起酥油（Shortening / 白油）相较于天然黄油，其纯脂肪含量通常为：", "options": {"A": "约50%", "B": "100%（纯脂肪，无水分与乳固体）", "C": "约16%", "D": "0%"}, "answer": "A", "explanation": "打发的黄油是油包水体系（W/O），蛋液含水约75%。一次性加入过多冰冷蛋液，水分无法被黄油中的卵磷脂充分乳化，黄油遇冷凝结析出水珠，面糊瞬间变成豆腐渣状（水油分离），蛋糕质地粗糙易塌陷。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "植物油经过部分氢化工艺制成的起酥油，可能产生的对心血管不利的成分是：", "options": {"A": "反式脂肪酸（Trans Fatty Acids）", "B": "优质乳清蛋白", "C": "维生素C", "D": "天然叶绿素"}, "answer": "C", "explanation": "开酥（Lamination）的核心工艺：面团层与油脂层互不交融，反复三折形成数百层“面皮-油皮-面皮”。烘烤时黄油水分蒸发顶起面皮，融化的油脂浸润面团，出炉形成如蜂巢般轻薄蜂窝层次。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "制作意式奶油霜（Italian Meringue Buttercream）加入黄油时，蛋白霜温度应降至：", "options": {"A": "沸水100度", "B": "室温约25℃~28℃，防止黄油遇热化成液体水油分离", "C": "零下20度冷冻", "D": "80度高温"}, "answer": "D", "explanation": "加盐黄油通常含有 1.5%~2% 的食盐，主要是为了常温延长保质期。烘焙首选无盐黄油以便精准控制配方盐量；若错用含盐黄油，甜品会出现突兀咸味，做面包时额外的盐更会抑制作物酵母。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "调温巧克力（Couverture Chocolate）必须进行精密调温，关键是使可可脂形成稳定的：", "options": {"A": "不稳定的Ⅰ型晶体", "B": "高熔点、坚硬光亮且不易起霜的Ⅴ型晶体（Form V / β晶型）", "C": "无定形非晶态", "D": "液体状态"}, "answer": "A", "explanation": "牛奶和淡奶油是“水包油（O/W）”，水分占绝大多数；经过物理剧烈搅打破乳（Churning），脂肪球膜破裂聚集连成连续脂肪网，将微小水滴包裹在内，转变为“油包水（W/O）”的黄油。"}, {"id": 28, "type": "single", "question": "制作吐司面包时通常采用“后加黄油法”，主要原因是：", "options": {"A": "避免油脂过早包裹面粉阻碍面筋水合扩展，缩短搅拌时间", "B": "防止黄油被酵母分解成酒精", "C": "使黄油在高温下提前燃烧", "D": "防止面粉变黑"}, "answer": "C", "explanation": "薄刷黄油一举两得：一是物理隔离锅底防止面糊焦糊粘锅，二是黄油中的微量乳糖和乳蛋白在受热时产生美拉德褐变，赋予松饼金黄诱人的色泽和扑鼻奶香味。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "油脂包裹淀粉颗粒并隔绝水分流失，对出炉烘焙制品的正面影响是：", "options": {"A": "加速面包硬化变质", "B": "有效延缓面包内部淀粉老化回生，保持柔软并延长货架期", "C": "彻底消灭全部酵母", "D": "使面包完全失去水分"}, "answer": "A", "explanation": "【考点解析】：油脂氧化酸败产生的过氧化物和醛酮类有害物质具有不可逆化学毒性，高温加热不仅无法消除哈喇味，反而加速热聚合产生致癌物，必须废弃，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "工业白油（起酥油）在白色翻糖或纯白奶油霜中广受青睐，主要是因为其：", "options": {"A": "纯白无色、无特殊杂味且起酥打发性能稳定", "B": "含有鲜艳人工黄色素", "C": "能完全替代白砂糖", "D": "常温下为纯液体"}, "answer": "C", "explanation": "面团中的糖和蛋白质在高温烘烤下会发生焦化粘附在烤盘金属细孔中。垫硅油纸或刷薄油能提供有效物理滑脱隔离层，避免出炉后死死粘在盘上无法铲起。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "工业“乳化起酥油（Emulsified Shortening）”中添加了甘油单酯等乳化剂，其最大优势是：", "options": {"A": "能吸收更多水分和糖分，制作高比例超湿润蛋糕（High-Ratio Cake）", "B": "彻底消除所有热量", "C": "烘烤时完全不上色", "D": "使蛋糕质地如石头坚硬"}, "answer": "A", "explanation": "过氧化值（POV）是油脂初级氧化产物（氢过氧化物ROOH）含量的指标。油脂酸败初期POV显著升高；随着氧化深入过氧化物分解为醛酮，POV可能反而回落。它是油脂品质控制的关键门槛。"}, {"id": 32, "type": "single", "question": "打发动物性鲜奶油（Whipping Cream）时若打发过度，最容易出现的物理现象是：", "options": {"A": "脂肪球膜破裂聚集发生“油水分离”，变成粗糙黄油粒与乳清液体", "B": "体积无限膨胀变成气体", "C": "完全凝固成坚硬石块", "D": "完全变成透明纯水"}, "answer": "D", "explanation": "后油法是面包制作的金科玉律：先让面粉充分吸收水分形成坚固的初步网状面筋骨架（扩展阶段），然后再加入软化黄油。黄油渗入面筋间隙充当润滑剂，能助推面筋拉出完美的透明薄膜。", "difficulty": "easy"}, {"id": 33, "type": "single", "question": "商业标准天然无盐动物黄油中，水分含量通常被严格控制在：", "options": {"A": "约 16% ~ 18%", "B": "约 50% ~ 60%", "C": "约 80%", "D": "0%"}, "answer": "B", "explanation": "重油蛋糕（黄油含量高）出炉时表皮毛孔张开，趁热刷糖浆酒，水分和糖分被高油组织锁住。密封冷藏熟成 1~2 天后，黄油与酒香深度交融，口感极其湿润醇厚细腻。", "difficulty": "easy"}, {"id": 34, "type": "single", "question": "在制作硬质意式佛卡夏（Focaccia）或恰巴塔欧包时，常选用的植物油脂是：", "options": {"A": "特级初榨橄榄油（Extra Virgin Olive Oil）", "B": "猪油白油", "C": "人造氢化起酥油", "D": "工业机械润滑油"}, "answer": "A", "explanation": "黄油冷藏（0℃~4℃）保质期通常在数月内，但开封后容易氧化吸味；将其切成50g或100g小块用铝箔纸和密封袋紧密包好，放入 -18℃ 冰冻冷冻室可保存大半年，用时取一块解冻即可。", "difficulty": "easy"}, {"id": 35, "type": "single", "difficulty": "medium", "question": "制作曲奇花嘴挤曲奇时，若配方黄油软化不足或天气太冷变硬，最直接的实操困难是：", "options": {"A": "面糊过软自动流出", "B": "面糊质地坚硬阻力极大，极难挤出花纹甚至挤爆裱花袋", "C": "曲奇在烤箱中瞬间融化", "D": "烤出曲奇内部完全空心"}, "answer": "D", "explanation": "油脂氢化（Hydrogenation）：液态植物油含较多不饱和双键，在镍等催化剂作用下与氢反应转为饱和脂肪酸，熔点升高变固态起酥油。但部分氢化工艺易产生反式脂肪酸（Trans fat），现代烘焙趋向采用完全氢化或酯交换技术替代。"}, {"id": 36, "type": "single", "question": "烘烤可颂或丹麦酥开酥面包时，烤炉温度必须保持在适宜高温（约190℃~200℃），主要目的是：", "options": {"A": "让水蒸气迅速爆发顶起面皮分层，并快速定型防止黄油未膨胀就融化漏油流淌", "B": "彻底烧黑表皮", "C": "防止酵母产气", "D": "使面包内部水分排空"}, "answer": "B", "explanation": "司康和美式派皮的灵魂在于“保持冷硬黄油颗粒（Sablage）”。冰黄油被切拌成豌豆粒大小裹上干粉，揉时不融化、不起筋；烘烤时黄油瞬间融化留下孔洞、水分汽化顶开面皮，带来松酥掉渣口感。", "difficulty": "medium"}, {"id": 37, "type": "combination", "question": "在商业工业饼干生产中，棕榈油（Palm Oil）被极广泛应用的核心优势是：", "options": {"A": "天然半固态、抗氧化稳定性高、耐煎炸且成本低", "B": "完全不含任何脂肪酸", "C": "熔点在零下十度", "D": "带有强烈苦味"}, "answer": "A", "explanation": "【考点解析】：制作经典荷兰酱（Hollandaise Sauce）必须使用温热微融的澄清黄油（Clarified Butter）缓慢细流注入蛋黄基底中边打边乳化，直接丢入冷冻硬黄油块不仅无法乳化，更会造成严重水油分离结块，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确。", "difficulty": "medium"}, {"id": 38, "type": "single", "question": "巧克力制品在储存中若经历剧烈温差波动，表面出现的灰白无光泽“起霜（Bloom）”主要是：", "options": {"A": "发霉产生的青霉菌菌落", "B": "可可脂结晶融化并在表面重新析出无序结晶（脂霜/Fat Bloom）", "C": "食盐晶体升华", "D": "面粉受潮结块"}, "answer": "A", "explanation": "油脂是强弱化原料。过量油脂会严重打断并阻碍面筋骨架支撑力，导致蛋糕或面包出炉严重下陷塌腰；烘烤时大量油脂从气孔渗出淌在烤盘上，口感黏腻、油腻糊口。", "difficulty": "medium"}, {"id": 39, "type": "single", "difficulty": "hard", "question": "在烘焙油脂中，为了防止不饱和油脂在货架期氧化酸败，常添加的天然抗氧化剂是：", "options": {"A": "食用维生素E（生育酚 / Tocopherol）", "B": "精制细砂糖", "C": "纯清水", "D": "小麦淀粉"}, "answer": "C", "explanation": "单甘酯（Monoglycerides）和大豆卵磷脂是烘焙王牌乳化剂：分子兼具亲水端和亲油端，促使面团中水油均匀乳化，并与淀粉分子络合阻止淀粉结晶回生（Anti-staling），使工业面包数天依然柔嫩软弹。"}, {"id": 40, "type": "single", "question": "烘焙工坊排出的废弃炸油与废油脂，规范环保的处理措施是：", "options": {"A": "直接倒入厨房下水道冲走", "B": "收集在专用废油桶中，交由有资质的废油脂回收企业规范处理", "C": "泼洒在门外花草绿化带中", "D": "倒入烘焙搅拌缸中重新利用"}, "answer": "B", "explanation": "黄油熔点约在 30℃ 上下。用冰冷水冲洗不仅洗不掉，还会让黄油迅速凝结牢固粘在不锈钢盆上；而 45℃ 以上的温热水能瞬间融化固态油脂，配合洗洁精的乳化表面活性剂，油脂一冲即净。", "difficulty": "easy"}]}, {"chapter_id": 12, "chapter_title": "第12单元｜糖 (Sugar)", "intro": "高一厨艺理论基础：认识糖类原料、烘焙上色、保水防老化、打发稳定与储存常识（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "制作普通戚风蛋糕、海绵蛋糕时最常使用且易溶解的糖是：", "options": {"A": "粗海盐", "B": "大块老冰糖", "C": "细砂糖（Granulated Sugar）", "D": "粗盐颗粒"}, "answer": "C", "explanation": "细砂糖颗粒细腻均匀，在打发蛋清或全蛋时能迅速溶入蛋液，帮助蛋白霜形成坚固细腻的气泡，是烘焙中最常用的糖。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "面包烘烤时表面慢慢变成金黄色并散发扑鼻甜香，主要是因为：", "options": {"A": "面粉高温燃烧冒烟", "B": "糖分在高温下发生的美拉德反应与焦糖化反应", "C": "烤盘油脂受热渗出表皮", "D": "酵母菌在高温下熟化变色"}, "answer": "B", "explanation": "烘烤金黄色彩与香气主要由两部分决定：糖分高温焦糖化，以及还原糖与蛋白质在受热时产生的美拉德反应，带来诱人色泽与焦甜风味。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "烘焙热化学中，“美拉德反应”与“焦糖化反应”的核心本质区别在于：", "options": {"A": "反应温度完全相同", "B": "焦糖化反应需依赖酵母活菌启动", "C": "两者完全属于同一种生化反应", "D": "美拉德反应需还原糖与氨基酸参与，焦糖化则是纯糖热解"}, "answer": "D", "explanation": "美拉德反应是“还原糖+蛋白质氨基酸”在120℃以上发生的复杂非酶褐变，产生浓郁复杂的烘烤香气（如面包脆皮、烤肉香）；焦糖化反应是“纯糖受热”在160℃以上自身脱水降解并聚合生成焦糖色与焦苦香（如焦糖布丁）。"}, {"id": 4, "type": "single", "question": "烘焙使用的市售防潮糖粉（Icing Sugar）中，通常添加了约3%~5%的哪种原料以防受潮结块？", "options": {"A": "干燥白面粉", "B": "食用玉米淀粉（Cornstarch）", "C": "纯精制食盐", "D": "食用小苏打粉"}, "answer": "C", "explanation": "糖是天然的保水剂（吸湿性好）。适量的糖能锁住水分，让出炉的蛋糕放置两三天依然柔嫩湿润；如果私自大量减糖，蛋糕会变得干硬粗糙、极易老化掉渣。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于食糖在烘焙食品中物理化学功能的叙述，下列哪些是正确的？
Ⅰ. 提供甜味与热量
Ⅱ. 吸湿保水，延缓面包老化
Ⅲ. 软化面筋，增加蛋糕细腻度
Ⅳ. 增加面团硬度，使骨架更坚韧", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "A", "explanation": "【考点解析】：糖具有强吸水渗透压，当糖用量超过面粉总重 8%~10% 后就会对酵母产生抑制渗透压，超过 20%~25% 会严重脱水抑制酵母活性（导致发酵极度缓慢甚至停滞），必须改用高耐糖酵母，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确阐明了糖的核心烘焙功能。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "传统广式月饼饼皮调制中，必须使用“转化糖浆（Invert Sugar Syrup）”，其主要工艺作用是：", "options": {"A": "增加饼皮硬度防止变形", "B": "含还原糖，促使饼皮快速着色、防返砂并促进出炉后“回油”变软", "C": "降低月饼甜度至零", "D": "彻底杀死馅料中的细菌"}, "answer": "D", "explanation": "糖粉颗粒极其微细，能与杏仁粉完美贴合，不会在面糊中留下未化开的粗糖粒，使马卡龙烤出光滑如镜的表面和漂亮裙边。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "天然纯蜂蜜在烘焙中能赋予制品极高湿润度且不易干燥，主要因为其富含：", "options": {"A": "不易吸收水分的纯蔗糖晶体", "B": "吸湿性极强的单糖（果糖与葡萄糖）", "C": "耐高温的纯纤维素", "D": "高浓度的粗面筋蛋白"}, "answer": "C", "explanation": "烘焙百分比（Baker's Percentage）以面粉总重量为恒定 100%：糖投料量 = 1000g × 18% = 180g；盐投料量 = 1000g × 1.5% = 15g。精准计算是配方执行基石。"}, {"id": 8, "type": "single", "question": "传统红糖（Brown Sugar）或黑糖相较于精制白砂糖，具有浓郁独特的风味，主要因为其保留了：", "options": {"A": "天然甘蔗糖蜜（Molasses）与矿物质微量成分", "B": "大量的黑芝麻粉", "C": "人工添加的黑色素", "D": "研磨的木炭灰"}, "answer": "D", "explanation": "糖是蛋白霜的“稳定剂与定型骨架”。一次性加入大量糖会严重压制蛋清起泡；分三次加糖，先让蛋清打出粗泡再逐步加糖，糖液融化形成黏稠保护膜包裹气泡，蛋白霜细腻坚挺不易消泡。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "在面团发酵初期，酵母菌最优先直接吸收并代谢产生二氧化碳的单糖是：", "options": {"A": "大分子淀粉颗粒", "B": "不可溶的纤维素", "C": "葡萄糖（Glucose）与果糖（Fructose）", "D": "高分子麦谷蛋白"}, "answer": "B", "explanation": "糖在蛋糕中不仅提供甜味，更起着“支撑气泡结构”与“锁水保湿”的物理功能。大幅过度减糖会导致蛋白霜稳定性断崖式下跌，拌粉易消泡，烤出的蛋糕体积矮小、口感干硬掉渣且极易塌陷回缩。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "制作配方中糖量极高（如含糖量超过8%~10%）的甜面包时，必须选用“耐高糖高活性干酵母”，原因是：", "options": {"A": "普通酵母在高糖高渗透压环境中容易脱水受抑，耐高糖酵母具高渗透压耐受力", "B": "普通酵母不吃糖只吃盐", "C": "耐高糖酵母会把糖分解为纯水", "D": "高糖环境会使普通酵母瞬间沸腾"}, "answer": "C", "explanation": "红糖/黑糖（Brown Sugar）精炼程度较低，保留了甘蔗中天然的糖蜜（Molasses）和铁、钙等矿物质，具有浓郁独特的焦香蔗香，并带有微酸性，常用于制作传统姜饼、桂圆红枣蛋糕等特色西点。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "制作戚风蛋糕打发蛋白霜时，分次加入细砂糖的主要作用机理是：", "options": {"A": "加速蛋白气泡破裂消泡", "B": "糖溶于蛋清增加黏稠度，保护微泡不破裂，使泡沫细腻紧密且耐热稳定", "C": "把蛋白瞬间凝固成果冻", "D": "使蛋白变黄"}, "answer": "B", "explanation": "糖是高渗透压物质。当糖含量>8%时，高浓度糖液在酵母细胞周围形成巨大渗透压（Osmotic Pressure），酵母菌体内水分被倒吸渗出，细胞发生质壁分离，代谢酶活性骤降。因此高糖甜面包必须使用“耐高糖高活性干酵母”。"}, {"id": 12, "type": "single", "question": "在烘焙配方平衡学中，食糖属于“柔性材料”，其软化面点的机理是：", "options": {"A": "糖分与蛋白质争夺水分，抑制面筋过度形成，并提高蛋白质凝固温度", "B": "糖分直接水解破坏面粉淀粉", "C": "糖分在高温下转化为油脂", "D": "糖分消除面团中的所有空气"}, "answer": "B", "explanation": "白砂糖具有较强的吸湿性。暴露在潮湿空气中吸收水分，随后水分蒸发会在糖晶体接触面形成微型糖桥，使砂糖板结成硬块。因此开封后必须装入密封罐封紧，存放在干燥阴凉处。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "在熬制法式焦糖酱（Caramel Sauce）时，纯蔗糖开始发生剧烈热分解脱水、呈现琥珀色焦香的温度范围通常是：", "options": {"A": "0℃ ~ 40℃", "B": "60℃ ~ 80℃", "C": "160℃ ~ 180℃", "D": "350℃以上"}, "answer": "A", "explanation": "【考点解析】：粗粒大冰糖在低水分曲奇面团中根本无法融化，烘烤后会在表面留下坚硬未溶的大糖颗粒并导致花纹坍塌，曲奇首选细砂糖或糖粉，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ符合原料实务。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "在家庭烘焙中，制作戚风蛋糕若错用大颗粒老冰糖直接加入蛋白打发，最可能导致的失败是：", "options": {"A": "冰糖迅速融化使蛋白打发过度", "B": "大颗粒冰糖难以融化沉底磨破打蛋盆，蛋白霜粗糙且出炉后蛋糕布满空洞糖斑", "C": "蛋糕在烤箱中瞬间燃烧", "D": "蛋糕体变成完全透明"}, "answer": "D", "explanation": "转化糖浆由蔗糖经柠檬酸水解为葡萄糖与果糖而成。单糖分子小、吸湿保水性极强，且还原糖含量极高，烘烤时上色快且均匀，更赋予月饼“回油”特性，使饼皮放置1~2天后变得晶莹剔透、柔软油润。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "从化学分子结构分类，我们日常使用的精制白砂糖（蔗糖/Sucrose）属于：", "options": {"A": "单糖（一分子组成）", "B": "双糖（由一分子葡萄糖和一分子果糖缩合而成）", "C": "多糖（大分子聚合物）", "D": "无机矿物盐"}, "answer": "B", "explanation": "蔗糖（Sucrose）由葡萄糖半缩醛羟基与果糖半缩酮羟基脱水缩合而成，分子中没有自由半缩醛/酮羟基，属于典型的非还原糖，不能直接与氨基酸缩合发生美拉德反应，必须在加热或酸性条件下水解转化为葡萄糖和果糖后才能参与美拉德褐变。"}, {"id": 16, "type": "single", "question": "在中式面点及饴糖制作中，常使用的“麦芽糖（Maltose）”，其分子结构属于：", "options": {"A": "单糖", "B": "由两分子葡萄糖构成的双糖（还原糖）", "C": "多糖淀粉", "D": "纯蛋白质"}, "answer": "C", "explanation": "大粒粗糖在常温蛋清中极难溶化。不仅无法形成保护气泡的黏性糖液，硬糖粒沉入盆底还会物理扎破脆弱气泡导致消泡，烤出的蛋糕底部会有未化开的焦糖硬块，内部组织粗糙塌陷。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "现代低卡烘焙常用的“赤藓糖醇（Erythritol）”或“木糖醇”，在烘焙烘烤特性上相较于普通白砂糖的差异是：", "options": {"A": "高温烘烤极难发生美拉德褐变与焦糖化反应，上色极为微弱", "B": "烘烤时上色速度快十倍", "C": "会被酵母迅速大量代谢产气", "D": "热量高于白砂糖五倍"}, "answer": "C", "explanation": "酵母菌是活的微生物，它通过体内的转化酶将面团中的葡萄糖、果糖、蔗糖和麦芽糖分解代谢，释放出二氧化碳气体（撑起面包蜂窝孔洞）和微量乙醇（带来发酵香气）。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "制作传统手工水果果酱时，配方中加入高达50%~60%的高浓度糖，其食品保鲜原理主要是：", "options": {"A": "糖分直接释放有毒气体", "B": "形成极高渗透压环境，夺取微生物细胞水分，强烈抑制细菌与霉菌繁殖", "C": "将水果水分全部排空", "D": "破坏所有水果维生素"}, "answer": "B", "explanation": "防潮糖粉（又称装饰糖粉）通常添加了 3%~8% 的熟化玉米淀粉或微胶囊植物油脂包裹。淀粉和油脂充当物理屏障，阻止糖分子吸收空气中的水分或蛋糕内部的水汽，使其长时间保持干爽洁白。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "烘烤软质甜面包时，若配方中严重漏加白砂糖，出炉后的成品外观最直观的瑕疵是：", "options": {"A": "表皮深黑焦糊", "B": "表皮极为苍白、缺乏光泽与金黄色泽，且口感干硬不甜", "C": "面包膨胀过大炸裂", "D": "内部充满大空洞"}, "answer": "D", "explanation": "118℃~121℃ 是经典“软球期（Soft-ball Stage）”。糖浆含水量约12%~15%，滴入冷水冷却后可用手指搓捏成柔软变形的弹力小糖球。此温区糖浆是制作意式蛋白霜（Italian Meringue）与法式马卡龙的核心原料。"}, {"id": 20, "type": "single", "question": "在制作美式曲奇饼干时，砂糖在烘烤中先融化展开、出炉冷却后重新结晶脆化，主要赋予饼干：", "options": {"A": "像面包一样的柔软拉丝感", "B": "边缘香脆、质构酥脆的标志性口感（Crispness）", "C": "像果冻一样的Q弹嚼劲", "D": "完全无法凝固的液体状态"}, "answer": "D", "explanation": "焦糖熬制是纯糖的高温热解反应（160℃~180℃）。必须温和控温，当糖浆从金黄渐变为晶莹透亮的琥珀红褐色并散发焦糖甜香时迅速离火降温，过火一秒就会变黑焦苦、散发糊味无法食用。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "熬制糖浆（如太妃糖、转化糖浆）时，为了防止糖浆冷却后重新结晶析出（返砂），常采取的工艺措施是：", "options": {"A": "加入少量柠檬酸（或塔塔粉）促使蔗糖水解，熬煮时避免剧烈搅拌锅壁", "B": "在糖浆中倒入大量生冷清水", "C": "用铁勺在锅内飞速剧烈画圈搅拌", "D": "向糖浆中倒入大量干面粉"}, "answer": "A", "explanation": "【考点解析】：美拉德反应在常温下进行极慢，通常在 140℃~165℃ 高温烘烤阶段迅速爆发，温度越高褐变越快，低温冷冻下基本停滞，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ完全符合食品化学理论。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "在高级日式西点中常使用的“海藻糖（Trehalose）”，相较于白砂糖的核心工艺优势是：", "options": {"A": "甜度仅为蔗糖约45%，甜味温和清爽，且保水防老化能力极佳", "B": "甜度比白砂糖高十倍", "C": "属于纯天然强力防腐剂", "D": "在水中完全不溶解"}, "answer": "D", "explanation": "蜂蜜是蜜蜂采集花蜜经体内转化酶分解而成的天然糖蜜，约含 70%~80% 的单糖（葡萄糖和果糖）。果糖是所有天然糖中甜度最高、吸湿保水性最强的糖，赋予蜂蜜蛋糕湿润绵密的独特质感与天然花香。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "烘焙车间用来测量熬煮果酱或糖浆浓度的“糖度计（折光仪）”，其测量单位通常标示为：", "options": {"A": "分贝（dB）", "B": "白利度（Brix / °Bx）", "C": "毫米汞柱（mmHg）", "D": "微米（μm）"}, "answer": "A", "explanation": "果糖（Fructose）是甜度最高的天然糖。在常温和冷态下其β-D-吡喃果糖异构体占优势，相对甜度可达150~173（以蔗糖为100）。温度越低果糖清甜感越强；而麦芽糖（约32）、乳糖（约16~30）甜度远低于蔗糖。"}, {"id": 24, "type": "single", "question": "制作法式马卡龙外壳或英式皇家糖霜（Royal Icing）时，必须选用极细的纯糖粉而非粗砂糖，原因是：", "options": {"A": "粗砂糖无法迅速溶解，会导致面糊颗粒粗糙、消泡或消光开裂", "B": "粗砂糖价格过于昂贵", "C": "粗砂糖烘烤时会自发爆炸", "D": "糖粉完全不含热量"}, "answer": "C", "explanation": "糖蜜是制糖过程结晶分离后的浓缩液体，含丰富矿物质和有机酸，色泽深黑、香气深沉微苦，能赋予传统重果干蛋糕标志性的醇厚色泽、深邃风味及优异的长期湿润保水防腐力。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "日常厨房中白砂糖存放于潮湿高温环境极易结成坚硬大石块，规范的防潮储存要求是：", "options": {"A": "直接敞口放置在水槽旁边", "B": "密封存放于阴凉干燥处，相对湿度控制在60%以下", "C": "倒入沸水中浸泡保存", "D": "倒在地面上晾晒"}, "answer": "B", "explanation": "意式蛋白霜是烘焙顶级技术：118℃~121℃ 的滚烫高温糖浆冲入蛋白，瞬间使生蛋白变性凝固（巴氏巴氏杀菌杀灭沙门氏菌，可安全生食），同时糖浆冷却形成高粘性网络，打出的蛋白霜光滑如丝缎、坚挺不消泡，是法式马卡龙与高级慕斯的灵魂。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "制作中式拔丝甜点（如拔丝地瓜）时，熬糖达到能够拉出纤细金黄长丝的阶段通常称为：", "options": {"A": "线状阶段", "B": "硬脆阶段（拔丝阶段，糖温约150℃~160℃）", "C": "软球阶段", "D": "水解阶段"}, "answer": "C", "explanation": "细砂糖颗粒在烘烤初期融化会促使面团向外延展扩散；而糖粉极细且溶解快，面糊流动延展性小，烤出的曲奇花纹极清晰立体、不易摊塌，表面平整细腻，口感也由脆硬转为酥软酥松。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "在制作巧克力甘纳许（Ganache）或淋面酱时加入少许水磨葡萄糖浆，主要作用是：", "options": {"A": "防止蔗糖重结晶、增加镜面光泽并保持柔顺延展性", "B": "降低巧克力的熔点至零度", "C": "使巧克力变成果冻状", "D": "防止巧克力融化"}, "answer": "A", "explanation": "高果糖浆（如HFCS-55）由玉米淀粉经酶法异构化水解制成，富含果糖与葡萄糖。其溶解度极高不结晶、吸湿性与保水性极其优越，价格低廉，能有效锁住工业包装面包内部水分，数日放置依然松软不硬。"}, {"id": 28, "type": "single", "question": "制作普通吐司时若配方中砂糖用量过高（超过面粉的25%以上），出炉后最易导致的结构缺陷是：", "options": {"A": "面包内部质地坚硬紧密", "B": "高糖过度软化面筋骨架，出炉冷却后严重缩腰塌陷变软瘫", "C": "面包膨胀十倍高", "D": "面包完全不上色"}, "answer": "D", "explanation": "熬糖大忌：在糖粒尚未完全熔解前用勺子大力搅拌！搅动会使锅边溅起未化糖粒作为“晶核”，瞬间诱发链式结晶反应，整锅糖浆会在几秒内迅速结晶返砂（Recrystallization），变成一锅粗白硬糖砂。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "北美传统特色糖浆“枫糖浆（Maple Syrup）”，其主要提取原料来源于：", "options": {"A": "天然糖枫树树干中流出的汁液经浓缩熬制", "B": "人工合成香精加红糖水调配", "C": "深海海藻提取液", "D": "甜菜根熬汁浓缩"}, "answer": "A", "explanation": "【考点解析】：糖液熬煮超过 190℃~200℃ 会彻底炭化烧焦变苦，产生大量刺激性有害挥发烟气，完全失去食用价值，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ阐述了纯焦糖化反应的机理与熬糖防返砂要点。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "在制作重油磅蛋糕或曲奇面团时，细砂糖与软化黄油共同搅拌打发，糖颗粒所起的物理作用是：", "options": {"A": "细小糖晶体充当微型切割刃，摩擦切割黄油产生大量微小空气囊", "B": "融化成水稀释黄油", "C": "使黄油变硬结块", "D": "将黄油彻底漂白"}, "answer": "A", "explanation": "水饴/淀粉糖浆富含多糖与糊精，分子量交错，能强力阻碍蔗糖分子彼此拼合结晶（Anti-crystallization），同时提供良好的光泽度和保湿性，使甘纳许内馅如丝绒般顺滑细腻、永不返砂粗糙。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "根据烘焙百分比法则，某面包配方面粉为500g，砂糖烘焙百分比为12%，则实际称量砂糖重量应为：", "options": {"A": "12克", "B": "60克（即 500g × 12%）", "C": "120克", "D": "24克"}, "answer": "D", "explanation": "果糖是所有常见糖中焦糖化温度最低的，约105℃~110℃即开始分解褐变；而蔗糖和葡萄糖通常需160℃左右；麦芽糖需180℃左右。因此含果糖多的面团（如加蜂蜜、高果糖浆）在烤箱中极易过早发黑上色，需调低炉温。"}, {"id": 32, "type": "single", "question": "在熬煮焦糖制作海盐焦糖酱时，向高温沸腾焦糖中倒入常温淡奶油时必须分次缓慢加入，主要为了防范：", "options": {"A": "高温焦糖剧烈沸腾产生大量高温蒸汽喷溅烫伤操作人员", "B": "焦糖瞬间结成坚硬冰块", "C": "淡奶油完全变成纯水", "D": "锅底被烧穿破裂"}, "answer": "B", "explanation": "后厨秘技：柑橘类（柠檬、橙子）表皮含有珍贵的芳香油胞。细砂糖的细小结晶如同微小研磨砂纸，揉搓摩擦能刺破油胞，让天然精油（Limonene）均匀渗入糖中，烘烤出的蛋糕具有扑鼻清新的天然果香。", "difficulty": "easy"}, {"id": 33, "type": "single", "question": "烘烤传统法式泡芙或列日华夫饼表面常撒上白色的“珍珠糖（Nib Sugar / Pearl Sugar）”，其特点是：", "options": {"A": "耐高温烘烤不轻易融化，保持颗粒完整酥脆咀嚼感", "B": "在常温下迅速挥发消失", "C": "含有高浓度精制盐", "D": "遇热瞬间变成液体油"}, "answer": "C", "explanation": "糖极易溶于水，水分蒸发时残留在颗粒间的饱和糖液会重新析出微晶，将相邻的所有糖颗粒牢牢粘连在一起形成坚硬的“糖结块（Cake）”，必须用擀面杖敲打或隔水加热才能重新化开。", "difficulty": "easy"}, {"id": 34, "type": "single", "question": "在调制蛋奶卡士达酱（Custard）时，蛋黄中先加入砂糖拌匀，糖对蛋黄蛋白质的热学影响是：", "options": {"A": "降低蛋白质凝固温度使其立即凝固变硬", "B": "提高蛋黄蛋白质的热凝固温度，防止加入热牛奶时瞬间结成蛋花块", "C": "使蛋白质完全失去营养", "D": "将蛋黄漂白成透明液体"}, "answer": "A", "explanation": "面包上色靠“残余糖（Residual Sugar）”。若发酵过度（发过头），酵母把面团中的糖消耗殆尽，没有足够的糖参与焦糖化和美拉德反应，烤出的面包表皮惨白、无光泽、缺少香气；反之发酵不足糖残留多，极易上色焦糊。", "difficulty": "easy"}, {"id": 35, "type": "single", "difficulty": "medium", "question": "制作果酱时使用高甲氧基果胶（HM Pectin）形成坚固凝胶网络，必需的协同环境条件是：", "options": {"A": "高浓度糖（可溶性固形物>55%~65%）搭配酸性环境（pH 2.8~3.5）", "B": "完全无糖且强碱性环境", "C": "零度以下极度冰冷环境", "D": "加入大量食用面粉"}, "answer": "C", "explanation": "微量酸（如酒石酸氢钾/柠檬酸）在加热下能催化微量蔗糖水解生成转化糖（葡萄糖+果糖）。这些不同结构的单糖分子混杂在蔗糖溶液中，破坏了纯蔗糖晶格规则排列，从而强力抑制大结晶生成，使硬糖保持晶莹玻璃质感。"}, {"id": 36, "type": "single", "question": "在高级艺术翻糖蛋糕（Fondant Cake）制作中，包覆蛋糕外层光滑整洁的“翻糖皮”，核心成分是：", "options": {"A": "极细纯糖粉、水磨葡萄糖浆与甘油或明胶揉制的糖膏", "B": "纯高筋面粉调制的生面团", "C": "干燥细石灰粉末", "D": "动物猪油与食盐混合膏"}, "answer": "B", "explanation": "可丽饼受热仅需几十秒，微量糖分能迅速在高温锅底产生美拉德反应与轻微焦糖化，使可丽饼受热部位呈现经典的诱人金黄豹纹花斑（Tiger stripes），既美观又增添焦甜香气。", "difficulty": "medium"}, {"id": 37, "type": "combination", "question": "在冷冻面团工业技术中，配方中适度增加糖分浓度对酵母菌细胞的低温保护机理是：", "options": {"A": "糖分降低冰点，减少大冰晶生成，保护酵母细胞膜免受机械刺破受损", "B": "糖分将酵母彻底杀灭防止产酸", "C": "糖分完全排空面团水分", "D": "使面团在常温下永不变质"}, "answer": "A", "explanation": "【考点解析】：蛋白霜与马卡龙中糖不仅是甜味剂，更是气泡表面水膜的关键粘度骨架支撑剂，糖量过少会导致蛋白霜极易破泡消泡、马卡龙无法结皮且空心塌陷，绝不可随意减半，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确。", "difficulty": "medium"}, {"id": 38, "type": "single", "question": "在糖艺熬糖工艺中，熬煮糖浆从105℃到160℃会经历不同阶段，糖温达145℃~155℃时属于：", "options": {"A": "线状阶段（Thread Stage）", "B": "硬脆阶段（Hard Crack Stage，糖液滴入冷水形成脆硬脆玻璃丝）", "C": "软球阶段（Soft Ball Stage）", "D": "水煮阶段"}, "answer": "B", "explanation": "全蛋打发秘诀：蛋黄含有脂肪，常温下表面张力大阻碍起泡。隔40℃温水微温加热，蛋黄中的卵磷脂乳化活性最高、蛋液黏度与表面张力降低，细砂糖完全溶解，全蛋液能迅速打发出极其细腻丰富、蓬松发白的持久泡沫。", "difficulty": "medium"}, {"id": 39, "type": "single", "difficulty": "hard", "question": "针对糖尿病患者研发的低GI无蔗糖烘焙点心，常用来替代蔗糖的天然安全甜味剂组合是：", "options": {"A": "罗汉果甜苷、甜菊糖苷或赤藓糖醇", "B": "高浓度工业糖精钠超标添加", "C": "纯麦芽糖与蜂蜜混合", "D": "大量精制冰糖粉"}, "answer": "A", "explanation": "面粉中有两种关键淀粉酶：α-淀粉酶（随机切断直链淀粉生成糊精，起液化作用）；β-淀粉酶（从非还原端每次水解切下一个麦芽糖分子，起糖化作用）。β-淀粉酶高效释放发酵性麦芽糖，为酵母繁殖提供持续不断的糖源食物。"}, {"id": 40, "type": "single", "question": "烘焙大型工厂的原料糖仓储存管理中，对白砂糖粉尘必须严格防范的工业安全事故是：", "options": {"A": "糖晶体在空气中挥发中毒", "B": "高浓度微细可燃性糖粉尘在密闭空间遇明火引发的“粉尘爆炸”", "C": "白砂糖在常温下自发转化为酒精", "D": "仓库地基被糖分腐蚀下陷"}, "answer": "D", "explanation": "蚂蚁爬行极易从外界携带大量病原微生物和杂菌，其分泌的蚁酸和排泄物会严重污染整袋砂糖，具有明确卫生健康风险，不能为了省小钱危害健康，应彻底丢弃并清洁储物柜。", "difficulty": "easy"}]}, {"chapter_id": 13, "chapter_title": "第13单元｜鸡蛋 (Eggs)", "intro": "高一厨艺理论基础：认识鸡蛋结构、打发特性、乳化机理与新鲜度鉴别（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "制作戚风蛋糕打发蛋白霜时，打蛋盆与打蛋头必须严格达到的洁净要求是：", "options": {"A": "涂抹一层植物油润滑", "B": "无油、无水且严禁混入一丝蛋黄", "C": "装满冰水未倒净", "D": "撒一层生食盐"}, "answer": "B", "explanation": "油脂是蛋白发泡的头号杀手！蛋黄含有约30%的油脂。只要有一丝蛋黄或打蛋盆带油，油脂分子会迅速抢占蛋白界面，破坏气泡膜的表面张力，使蛋白霜无论如何拼命搅打都无法膨胀打发。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "制作全蛋海绵蛋糕进行全蛋打发时，最适宜快速充气起泡的蛋液温度是：", "options": {"A": "0℃以下冷冻冰蛋", "B": "温热约38℃~43℃（隔温水浴加热）", "C": "100℃沸腾开水", "D": "冷藏室4℃冰凉蛋液"}, "answer": "B", "explanation": "蛋黄是烘焙中最强大的天然乳化剂。其含有的卵磷脂（Lecithin）分子一端亲水、一端亲油，能在微小油滴外包裹一层亲水保护层，使油和水分子均匀混合交融，形成稳定细腻的乳化液（如蛋黄酱）。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "蛋黄在蛋糕面糊或蛋黄酱中发挥强大“天然乳化作用”，其核心功能成分是：", "options": {"A": "卵磷脂（Lecithin）", "B": "粗纤维素", "C": "双效泡打粉", "D": "氯化钠食盐"}, "answer": "C", "explanation": "哈氏单位（Haugh Unit，HU）是国际蛋品新鲜度金标准：通过微米测高仪测量浓厚蛋白高度，结合蛋重通过对数公式计算。HU>72为特级新鲜AA级，HU在60~72为A级，HU<31为劣变变质蛋。"}, {"id": 4, "type": "single", "question": "鸡蛋在烤箱高温烘烤中使蛋糕面糊由流动液体转化为松软多孔固体，主要依靠：", "options": {"A": "油脂融化", "B": "蛋白质的热凝固性（变性凝固定型）", "C": "淀粉酶水解", "D": "糖分完全挥发"}, "answer": "C", "explanation": "新鲜鸡蛋内部水分饱满，钝端气室极其微小，整体密度大于水，因此会平稳横躺沉在水底；随着存放变久水分蒸发气室变大，鸡蛋会逐渐倾斜、直立，完全浮在水面上的则是严重散黄变质的坏蛋。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于鸡蛋在烘焙制品中功能的叙述，下列哪些是正确的？
Ⅰ. 蛋白打发充气，提供膨松骨架
Ⅱ. 蛋黄卵磷脂乳化油脂与水分
Ⅲ. 蛋黄色素与美拉德反应增添诱人金黄色泽
Ⅳ. 鸡蛋在烘烤后能完全转化为二氧化碳", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "A", "explanation": "【考点解析】：蛋类蛋白质受热变性凝固（蛋清约 62℃~65℃ 开始凝结，蛋黄约 65℃~70℃ 凝结），这是蛋糕从流体糊状转变为松软海绵固态支撑骨架的关键成型机理，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ完全正确。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "制作戚风蛋糕打发蛋白达到“干性发泡（硬性发泡/Stiff Peak）”的直观标志是：", "options": {"A": "蛋白呈大水泡流动状", "B": "拉起打蛋头带出直立不弯曲的短小尖角，倒扣打蛋盆不滑落", "C": "蛋白完全变成黄色", "D": "蛋白结成坚硬豆腐块"}, "answer": "C", "explanation": "新鲜蛋清呈弱碱性（pH约8.8~9.2），起泡快但泡沫较脆弱易破。加入微量酸（柠檬汁或塔塔粉/酒石酸氢钾）将pH值调节至偏中性酸性（pH约5.0~5.5），使蛋白质分子更富韧性，打出的蛋白霜洁白细腻、坚挺不易塌陷消泡。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "制作柔软不易开裂的蛋糕卷（瑞士卷）时，蛋白霜通常打发至：", "options": {"A": "粗泡鱼眼阶段", "B": "湿性发泡（软性发泡，拉起呈柔软下垂的大弯钩）", "C": "过度打发棉絮状", "D": "完全不打发"}, "answer": "C", "explanation": "蛋奶液中鸡蛋蛋白质在牛奶稀释下凝固温度约为80℃~85℃。若炉温过高或受热超过90℃，蛋白质过度紧缩脱水，内部水分剧烈沸腾产生大量蒸汽蜂窝气孔，布丁粗糙出水变成老炖蛋；水浴低温烘烤能稳定维持柔嫩丝滑镜面质感。"}, {"id": 8, "type": "single", "question": "厨房中检验带壳鸡蛋新鲜度的常用盐水浮沉法，最新鲜的鸡蛋表现为：", "options": {"A": "完全漂浮在水面上打转", "B": "横卧沉在容器底部", "C": "悬浮在水中间", "D": "在水中快速融化"}, "answer": "B", "explanation": "蛋黄富含蛋白质与天然油脂。烘烤时受高温作用，蛋白质氨基酸与糖类发生美拉德褐变反应，烘烤出炉的面包表皮呈现极其耀眼的金黄色泽、油润亮光与酥脆薄皮。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "生鸡蛋壳表面极易附着并造成严重食物中毒的高危致病菌是：", "options": {"A": "乳酸菌", "B": "啤酒酵母菌", "C": "沙门氏菌（Salmonella）", "D": "青霉菌"}, "answer": "D", "explanation": "生鸡蛋极易被沙门氏菌（Salmonella）污染，食用未熟化的受污染鸡蛋会导致剧烈呕吐、腹泻和发烧。免烤甜点涉及生蛋黄或生蛋白霜时，必须严格使用经过巴氏杀菌认证的“可生食无菌鸡蛋”或使用高温糖浆烫熟。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "根据烘焙百分比法则，某海绵蛋糕配方面粉为200g，鸡蛋烘焙百分比为200%，则实际应称取全蛋液重量为：", "options": {"A": "200克", "B": "400克（即 200g × 200%）", "C": "100克", "D": "50克"}, "answer": "D", "explanation": "鸡蛋的大头（钝端）含有天然气室，且系带将蛋黄固定在中心。大头朝上能让气室位于最高点，蛋黄不易上浮贴在蛋壳上（贴壳蛋容易变质），呼吸微孔更畅通，保鲜时间显著更长。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "在受热温度特性上，纯蛋清与纯蛋黄开始凝固的温度差异表现为：", "options": {"A": "蛋清开始凝固温度（约60℃~62℃）低于蛋黄（约65℃~68℃）", "B": "两者完全相同都在100℃", "C": "蛋清需要在300℃凝固", "D": "蛋黄在零度凝固"}, "answer": "B", "explanation": "刚产出的新鲜蛋清溶有较多CO2呈微浑浊（pH约7.6）。存放中CO2经蛋壳微孔不断向外散逸，蛋清pH升至9.0以上，碱性环境促使卵黏蛋白与溶菌酶构成的网状凝胶复合物解离，导致浓厚蛋白变稀（水样蛋白增多），这是老化的典型特征。"}, {"id": 12, "type": "single", "question": "在烘焙原料配方分类平衡中，鸡蛋整体属于：", "options": {"A": "干性材料", "B": "湿性材料且属于强性（结构支撑）材料", "C": "纯油脂材料", "D": "化学膨松剂"}, "answer": "B", "explanation": "鸡蛋产出时表面附有一层天然胶护膜（Cuticle），能封闭气孔阻止外界细菌和霉菌入侵。用水大力清洗会破坏洗掉这层防线，水分渗入蛋壳微孔反而把外界细菌带入蛋内，使鸡蛋急剧腐败变质。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "制作曲奇饼干时配方中若只选用“熟蛋黄粉”或“生蛋黄”，其主要赋予成品的质构特性是：", "options": {"A": "极其坚韧有嚼劲如面包", "B": "口感极其酥松细腻、入口即化且蛋香浓郁", "C": "质地硬邦邦如石头", "D": "完全透明无色"}, "answer": "A", "explanation": "【考点解析】：油脂具有强烈的消泡破乳特性，会瞬间破坏气泡气-水界面张力导致打发彻底失败，严禁接触任何油脂，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ为蛋白打发的核心铁律。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "厨房中新鲜带壳鸡蛋在冰箱中冷藏储存时，正确的摆放朝向规范是：", "options": {"A": "大头（钝端有气室）朝上，小头朝下直立摆放", "B": "小头朝上，大头朝下", "C": "横放并堆叠压实", "D": "打碎后浸在热水中"}, "answer": "B", "explanation": "干性/硬性发泡（Stiff Peak）：蛋白霜极其坚挺光亮，慢慢提起打蛋头，蛋白尖端呈现短小、直立、挺拔的小尖角，不弯曲不垂头；倒扣打蛋盆稳如泰山绝不滑落，常用于制作经典戚风蛋糕与蛋白糖。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "打发蛋白霜若搅拌时间过长出现“打发过度（Over-whipped）”，蛋白霜的直观瑕疵是：", "options": {"A": "泡沫变成透明液体", "B": "失去光滑光泽，呈结块、棉絮颗粒状并出现离水出水现象", "C": "体积膨胀十倍", "D": "完全凝固成透明果冻"}, "answer": "D", "explanation": "蛋清中卵白蛋白（Ovalbumin）占约54%，卵转铁蛋白（Conalbumin/Ovotransferrin）占约12%。卵转铁蛋白对机械搅拌剪切力极敏感，最先在气泡表面变性展开形成亲水/疏水双面层，迅速捕捉并稳定初始气泡。"}, {"id": 16, "type": "single", "question": "新鲜鸡蛋清的天然pH值通常呈弱碱性（约7.6~7.9），存放时间越长其pH值会：", "options": {"A": "二氧化碳散失使pH值升高至9.0以上，碱性增强，起泡易消泡", "B": "迅速降至强酸性pH 1.0", "C": "完全保持恒定不变", "D": "转化为纯酒精"}, "answer": "C", "explanation": "全蛋打发对温度极敏感：冷藏蛋液表面张力极高、黏稠度大，空气极难打入，打发极度费时且气孔粗大不均。必须提前室温回温或隔 40℃ 温水浴轻微加温，全蛋液才能打发出丰富细腻、如丝绸般的蓬松面糊。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "制作戚风蛋糕打发蛋白时加入少许柠檬汁或塔塔粉，其生化机理是：", "options": {"A": "增加蛋清碱性", "B": "降低蛋白pH值至等电点附近，中和碱性使蛋白泡沫更细腻白皙耐热稳定", "C": "杀死所有沙门氏菌", "D": "彻底消除甜味"}, "answer": "C", "explanation": "打发过度（Over-beaten）：机械过度搅打使蛋白质分子过度交联紧缩，气泡壁变硬发脆破裂，水分被彻底挤出（离浆分水/Syneresis），蛋白霜失去光泽与延展性，变成一坨坨粗糙干燥的棉花渣，拌入面糊极易消泡沉底。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "打发蛋白霜时，白砂糖过早一次性全部加入对打发过程的不良影响是：", "options": {"A": "蛋白瞬间膨胀撑破打蛋盆", "B": "高浓度糖过早抑制蛋白质起泡性，导致难以打发、起泡极慢且体积偏小", "C": "蛋白霜变黑", "D": "打蛋头被折断"}, "answer": "D", "explanation": "蛋清凝固后质地偏硬韧有弹性（像果冻蛋白），而蛋黄富含脂肪与天然乳化剂，凝固后的蛋白质网状结构非常柔嫩松软。纯蛋黄与鲜奶油结合，烘烤出炉的布蕾如丝绒般在舌尖瞬间融化化口，风味醇厚无比。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "制作传统蛋黄酥或广式月饼时，新鲜咸蛋黄在包入馅料前常需喷洒高度白酒并入炉微烤，主要是为了：", "options": {"A": "把蛋黄彻底烤焦碳化", "B": "去腥增香并杀菌，促使其出油起沙提升风味", "C": "使蛋黄完全融化成液体油", "D": "降低咸蛋黄重量"}, "answer": "D", "explanation": "糖是天然的蛋白质保护剂与稀释剂。高浓度糖分子争夺水分子并与蛋白质极性基团水合，提高了蛋白质分子热稳定性，延缓其变性展开，从而使蛋液热凝固温度从约65℃大幅提升至80℃~85℃以上，防止加热时过早凝结成蛋花渣。"}, {"id": 20, "type": "single", "question": "在现代化大规模连锁工业烘焙工厂中，通常首选巴氏杀菌液体全蛋液代替壳蛋，主要优势是：", "options": {"A": "彻底避免人工打蛋壳碎屑混入与沙门氏菌污染，称量高效且品质标准稳定", "B": "液体蛋完全不含水分", "C": "价格接近免费", "D": "常温存放三年不变质"}, "answer": "C", "explanation": "新鲜鸡蛋的卵黄膜紧绷坚韧，蛋黄高高隆起呈浑圆半球状；浓厚蛋白黏度极大，如一层透明护垫紧紧环绕在蛋黄四周不流散，系带粗大清晰；陈旧鸡蛋卵黄膜松弛易破，浓厚蛋白变稀散开一片。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "熬煮卡士达酱（Custard Sauce）时必须用厚底锅小火持续搅拌并加热至约82℃~85℃，主要目的是：", "options": {"A": "让蛋黄充分受热凝固增稠且淀粉糊化，同时避免超过85度导致结块变成蛋花汤", "B": "将牛奶彻底烧干", "C": "使蛋黄完全蒸发", "D": "让酱汁变成透明硬块"}, "answer": "A", "explanation": "【考点解析】：全蛋液超过 60℃ 蛋白质即开始熟化凝结成蛋花汤，彻底丧失打发包气能力，隔水温水浴严控在 40℃ 左右，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ准确阐明了全蛋温打法的科学依据。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "烘烤焦糖鸡蛋布丁（Crème Caramel）时采用水浴低温烘烤，主要为了防止：", "options": {"A": "烤箱内部产生明火", "B": "高温导致蛋奶蛋白质过热剧烈凝固收缩，内部产生蜂窝粗糙孔洞并出水", "C": "布丁过度膨胀溢出烤盘", "D": "焦糖变甜"}, "answer": "C", "explanation": "蛋白糖（马林糖）的烘烤本质是“低温脱水干燥（Dehydration）”而非传统烘烤。通常用 90℃~100℃ 低温烘烤 1.5~2 小时，慢慢排尽水分，既能防止糖分高温焦糖化变黄变褐，又能使蛋白饼保持纯白无瑕、入口酥脆即化。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "打发蛋白霜时哪怕仅混入一小滴蛋黄也会严重阻碍打发，其科学机理是：", "options": {"A": "蛋黄中的脂肪是强消泡剂，降低蛋白表面张力破坏气泡膜", "B": "蛋黄中的胆固醇会吃掉空气", "C": "蛋黄会释放强酸腐蚀蛋白", "D": "蛋黄沉底无法搅拌"}, "answer": "A", "explanation": "蛋清和蛋黄中含有微量天然游离葡萄糖（约0.3%~0.5%）。喷雾干燥后，微量葡萄糖极易与蛋蛋白发生干燥状态下的美拉德褐变反应，导致蛋粉变黄变褐、溶解度下降并产生不愉快气味。因此工业上常在干燥前使用葡萄糖氧化酶或酵母发酵“脱糖”。"}, {"id": 24, "type": "single", "question": "西餐经典冷酱“蛋黄酱（美乃滋/Mayonnaise）”中，蛋黄所起到的关键物理作用是：", "options": {"A": "作为强力天然乳化剂，使大量植物油以微小油滴稳定分散在少量醋与水中", "B": "提供大量的淀粉糊精", "C": "使植物油凝固成肥皂", "D": "彻底中和白醋的酸味"}, "answer": "D", "explanation": "油脂是蛋白打发的克星。如果刚滴入微量蛋黄，因密度和表面张力蛋黄通常悬浮在表面，用洗净干燥的蛋壳瓣能产生表面张力将其完整托起舀出；切忌用手乱摸或用打蛋器打散，一旦蛋黄油脂分散，整盆蛋清彻底报废无法打发。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "在发酵好的面包表面烘烤前均匀刷上一层全蛋液，出炉后面包表皮的主要感官特征是：", "options": {"A": "呈现油亮诱人的深金黄色泽与光亮薄膜", "B": "表皮苍白无光泽", "C": "表皮变成果冻透明状", "D": "表皮迅速脱落"}, "answer": "B", "explanation": "卡士达酱加热时，锅底和锅边温度最高，最易首先达到蛋白质凝固点。若不持续快速搅拌，接触热源的蛋液会瞬间凝固变成一坨坨结块的粗糙“甜炒鸡蛋碎”；持续搅拌使热量均匀分散，蛋白质形成丝滑顺滑的均匀流体胶体。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "制作入口即化法式蛋白糖（Meringue Kisses）时，通常采用的烘烤工艺参数是：", "options": {"A": "250℃猛火急烤5分钟", "B": "90℃ ~ 100℃极低火长时间低温烘烤烘干（约90~120分钟）", "C": "放入沸水中煮熟", "D": "冷冻室速冻"}, "answer": "A", "explanation": "鸡蛋是面包的“全能营养与品质改良剂”：水分（75%）参与水合，蛋白提供烘烤定型骨架与松软孔壁，蛋黄卵磷脂乳化面团油脂延缓老化，天然类胡萝卜素赋予金黄诱人瓤色，并带来浓郁蛋香。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "在鸡蛋蛋白质化学组成中，占蛋白总蛋白质约54%、热凝固性最强的核心蛋白质是：", "options": {"A": "卵白蛋白（Ovalbumin）", "B": "麦胶蛋白", "C": "酪蛋白", "D": "角蛋白"}, "answer": "D", "explanation": "经典食品化学考点：蛋清含硫蛋白质长时间受热分解出微量H2S气体，并向温度较低的蛋黄中心渗透；与蛋黄中富含的Fe2+结合生成暗绿色难溶性沉淀FeS（硫化亚铁）。煮蛋熟后立即泡冰水，温差使气体向外扩散即可避免黑圈。"}, {"id": 28, "type": "single", "question": "制作日式温泉蛋（蛋黄凝固而蛋白呈半流动态），利用的蛋清与蛋黄凝固特性是：", "options": {"A": "在65℃~68℃恒温水浴中，蛋黄凝固而蛋清主要蛋白质尚未达到完全凝固温度", "B": "蛋清比蛋黄先熟", "C": "蛋白完全不含蛋白质", "D": "蛋黄完全由水组成"}, "answer": "B", "explanation": "打发蛋白第一守则：“无油无水，器具洁净”。不锈钢或玻璃碗表面光滑致密、极易彻底洗净且不吸附油脂（塑料碗亲油不易洗净），确保蛋白霜发泡不受任何外来杂质与油脂干扰。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "商业标准普通大号鸡蛋（Large Egg，带壳重约60g），去除蛋壳后的全蛋净重通常约为：", "options": {"A": "约 50 ~ 55 克（蛋白约30~35g，蛋黄约18~20g）", "B": "约 10 克", "C": "约 100 克", "D": "约 200 克"}, "answer": "A", "explanation": "【考点解析】：意式蛋白霜因热糖浆注入熟化了蛋清蛋白质，结构是三大蛋白霜中最稳定、最耐放且具杀菌安全性的，正统高级马卡龙（意式法）与慕斯饰面均首选意式蛋白霜，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ完全符合西点理论。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "鸡蛋在室温存放时间过长导致内部气室（Air Cell）显著扩大的主要原因是：", "options": {"A": "蛋壳微孔不断向外散失水分和二氧化碳气体", "B": "蛋黄在内部剧烈发酵产生甲烷", "C": "蛋壳吸收外部大量空气膨胀", "D": "蛋清完全转化为油脂"}, "answer": "A", "explanation": "传统海绵蛋糕不依赖化学泡打粉，完全依靠全蛋打发裹入的微小气泡受热膨胀支撑。若打发不充分，蛋糊中缺乏足够的气泡骨架，受热无法膨起，出炉后变成又薄又硬、湿黏发韧的死面块。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "制作法式修女泡芙的卡士达酱时，配方中加入适量玉米淀粉与蛋黄一同加热，主要优势是：", "options": {"A": "淀粉糊化保护蛋黄蛋白，提高抗结块耐热稳定性并赋予浓稠丝滑口感", "B": "让卡士达酱变成透明果冻", "C": "让蛋黄彻底失去颜色", "D": "降低酱汁粘稠度如清水"}, "answer": "C", "explanation": "蛋黄固形物含量约50%（含水量低，渗透压高），而蛋清含水量约88%（渗透压低）。在长时间储藏中，蛋清中的水分子自发跨过卵黄膜向蛋黄缓慢渗透，导致蛋黄体积变大、卵黄膜被极度撑薄脆弱，轻微磕碰即发生散黄。"}, {"id": 32, "type": "single", "question": "制作意式蛋白霜（Italian Meringue）时，将熬煮至118℃~121℃的热糖浆冲入打发的蛋白中，核心作用是：", "options": {"A": "高温糖浆巴氏杀菌杀灭沙门氏菌，使蛋白部分受热定型形成极其稳定光亮的泡沫", "B": "将蛋白瞬间烧黑焦化", "C": "让蛋白彻底消泡化成水", "D": "让蛋白霜迅速结冰"}, "answer": "B", "explanation": "国际与烘焙教材通用标准：一颗标准大鸡蛋带壳重约 55g~60g（蛋壳占约10%即6g，蛋清占约60%即30~35g，蛋黄占约30%即15~18g），去壳纯蛋液净重约为 50g。精准掌握此常识有助于按配方准确折算鸡蛋个数。", "difficulty": "easy"}, {"id": 33, "type": "single", "question": "制作马卡龙常用的“瑞士蛋白霜（Swiss Meringue）”，其打发操作特色是：", "options": {"A": "将蛋白与砂糖隔热水加热至约50℃~60℃至糖完全溶解，再移至打蛋机高速打发", "B": "直接向冰冷蛋白中加粗盐打发", "C": "在明火上将蛋白煮沸后打发", "D": "完全不加糖打发"}, "answer": "D", "explanation": "蛋壳一旦产生裂纹，天然防菌屏障彻底失效，冰箱或外界环境中的细菌（尤其是沙门氏菌与假单胞菌）会在几小时内顺着裂缝大量涌入蛋内极速繁殖，极具致病安全隐患，严禁用于制作点心。", "difficulty": "easy"}, {"id": 34, "type": "single", "question": "经典低热量“天使蛋糕（Angel Food Cake）”之所以呈现纯白细腻质地，是因为配方中：", "options": {"A": "完全不含一滴蛋黄与任何油脂，全靠大量纯蛋白打发充气与热凝固支撑骨架", "B": "加入大量食用白色素", "C": "使用特高筋面包粉", "D": "使用大量动物猪油"}, "answer": "B", "explanation": "可丽露面糊流动性极强且含大量全蛋和蛋黄。静置冷藏24~48小时（熟成/Resting）具有双重作用：一是让搅打产生的大量细小气泡完全浮出排尽（防止烘烤时过度膨胀顶出模具变蘑菇顶）；二是让淀粉与蛋白质分子充分水合，香草朗姆风味深度交融，烤出标志性的外脆焦黑内如蜂巢般软嫩卡士达布丁质感。", "difficulty": "easy"}, {"id": 35, "type": "single", "difficulty": "medium", "question": "制作提拉米苏或低温甜点需使用生鸡蛋时，为保证食品卫生安全，必须选用的鸡蛋规格是：", "options": {"A": "普通菜市场散装泥壳土鸡蛋", "B": "经过严格巴氏杀菌认证的可生食无菌鸡蛋", "C": "开裂破壳的打折处理蛋", "D": "常温存放一个月的陈蛋"}, "answer": "A", "explanation": "蛋糕油（Cake Improver/Gel）是复合亲水亲油表面活性剂。全蛋中蛋黄脂肪会阻碍起泡，蛋糕油能迅速在气液界面定向排列，显著降低液体表面张力，使全蛋液在数分钟内打发出极为丰富、极其细腻稳定的充气凝胶泡沫，耐消泡性极大提高。"}, {"id": 36, "type": "single", "question": "烘烤原味海绵蛋糕或戚风蛋糕时，为了有效消除烘烤中产生的天然蛋腥味，最常用的工艺调味手段是：", "options": {"A": "加入少许天然香草精、柠檬汁、柠檬皮屑或朗姆酒", "B": "加入大量大蒜汁和生姜末", "C": "加入大量食用辣椒油", "D": "加入大量工业酒精"}, "answer": "D", "explanation": "水浴烘烤法（Bain-Marie）：底盘沸水最高温度恒定在 100℃ 左右，水蒸气源源不断包裹模具周围，温和传导热量并保持烤箱内部高湿度。这使得极其娇嫩脆弱的乳酪蛋糊受热缓慢均匀，蛋白质不至于过度膨胀破裂，烤出的乳酪蛋糕表面平整光洁、不开裂、组织湿润入口即化。", "difficulty": "medium"}, {"id": 37, "type": "combination", "question": "蛋黄能够赋予烘焙西点浓郁的金黄诱人色泽，主要因为蛋黄中天然富含：", "options": {"A": "叶黄素（Lutein）与玉米黄素等天然类胡萝卜素", "B": "人工合成柠檬黄色素", "C": "天然叶绿素", "D": "纯金属铜离子"}, "answer": "A", "explanation": "【考点解析】：蛋壳表面有一层天然胶质胶护膜（Cuticle）能阻隔外界微生物侵入，若提前水洗会洗掉保护层并使水分渗入气孔，加速细菌侵入腐败，因此应在临用前清洗，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ叙述完全正确。", "difficulty": "medium"}, {"id": 38, "type": "single", "question": "构成鸡蛋外层坚硬保护壳的化学无机矿物质成分，主要是：", "options": {"A": "碳酸钙（Calcium Carbonate, CaCO3）", "B": "硫酸铜晶体", "C": "纯金属铁单质", "D": "氯化钠食盐"}, "answer": "A", "explanation": "出炉刷糖浆法（Glaze）：面包刚出炉时表皮温度高达 150℃ 以上，趁热薄刷一层蜂蜜水（蜂蜜加温水1:1）或杏桃果胶镜面糖浆，水分受热瞬间蒸发，在面包表面留下一层晶莹剔透的高光保护薄膜，既锁水保湿又美观诱人。", "difficulty": "medium"}, {"id": 39, "type": "single", "difficulty": "hard", "question": "在商业冷冻保存纯蛋黄时，若不加处理直接冷冻，解冻后蛋黄会变成橡胶状硬块（冷冻变性），常用的工业抗冻保护工艺是：", "options": {"A": "冷冻前在蛋黄液中加入约10%细砂糖或少许食盐搅匀", "B": "向蛋黄中注入大量生冷自来水", "C": "将蛋黄在微波炉中彻底加热烤熟", "D": "加入强酸强碱"}, "answer": "D", "explanation": "乳化三要素：分次慢加（给乳化剂包覆时间）、温度适宜（20℃~22℃油脂与蛋液温差小不结块凝油）、机械剪切充分；而搅拌盆外壁涂抹什么颜色油漆完全属于与食品生化乳化风马牛不相及的荒谬选项。"}, {"id": 40, "type": "single", "question": "在后厨敲开鸡蛋时，若发现蛋黄散黄、混浊并散发出刺鼻恶臭的硫化氢气味，规范的处理措施是：", "options": {"A": "把臭味部分倒掉，剩下蛋清继续做蛋糕", "B": "加大量香草精掩盖臭味后使用", "C": "彻底丢弃并严格清洗消毒接触过的器具与双手，杜绝交叉污染", "D": "高温煮熟后继续做馅"}, "answer": "C", "explanation": "臭鸡蛋散发的恶臭主要是蛋白质腐败被假单胞菌等腐败菌分解生成的硫化氢（H2S）、尸胺和肉毒毒素，含有严重剧毒与致命致病菌，任何高温烹煮都无法清除毒素，必须坚决彻底丢弃并严格消毒器具，杜绝食物中毒。", "difficulty": "easy"}]}, {"chapter_id": 14, "chapter_title": "第14单元｜乳制品 (Dairy Products)", "intro": "高一厨艺理论基础：认识鲜奶、淡奶油、奶粉与奶酪，掌握打发要领与乳脂常识（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "制作生日蛋糕抹面或裱花装饰时，高品质动物性淡奶油（Whipping Cream）的乳脂含量通常处于：", "options": {"A": "5% ~ 10%", "B": "35% ~ 38%（乳脂丰富易打发且质构稳定）", "C": "80% ~ 90%", "D": "0%"}, "answer": "B", "explanation": "巴氏杀菌鲜牛奶富含蛋白质与水分，拆封后接触空气中的杂菌，在常温下细菌会呈几何级数快速繁殖导致变酸变质；必须拧紧盖子冷藏保存并在2~3天内用完。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "在面包配方中加入纯鲜牛奶代替清水，烘烤出的面包表皮上色较深且更具金黄光泽，主要是因为牛奶中含有：", "options": {"A": "不易被普通酵母分解利用的天然乳糖（Lactose）促进美拉德褐变", "B": "大量的食用重金属", "C": "强酸性醋酸", "D": "高浓度酒精"}, "answer": "C", "explanation": "动物淡奶油（Whipping Cream）乳脂含量通常在 35%~38% 之间。必须在 4℃~8℃ 低温下搅打，冰凉的微细脂肪球相互碰撞抱团，形成坚固三维网状骨架包裹住空气，才能打发出轻盈立体的裱花奶油霜。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "普通新鲜全脂牛奶的化学组成中，水分所占的重量比例通常约为：", "options": {"A": "约 50%", "B": "约 87% ~ 88%", "C": "约 20%", "D": "100%"}, "answer": "D", "explanation": "淡奶油打发机理（Partial Coalescence）：打蛋头机械剪切破坏脂肪球膜，内部部分结晶的固态甘油三酯在气液界面彼此桥接团聚，形成牢固的三维连续脂肪骨架，将微小气泡与游离水分牢牢锁住。"}, {"id": 4, "type": "single", "question": "制作经典“重乳酪芝士蛋糕（New York Cheesecake）”时，作为核心主料的天然软质奶酪是：", "options": {"A": "干硬的帕玛森干酪", "B": "奶油奶酪（Cream Cheese）", "C": "蓝色发霉的蓝纹奶酪", "D": "脱脂纯奶粉"}, "answer": "B", "explanation": "牛奶中富含独特的乳糖（Lactose）。面包酵母不消耗乳糖，烘烤时所有乳糖完整保留在面团表皮，与牛奶蛋白质发生剧烈的美拉德褐变反应，使面包烤出极其均匀诱人的金褐光泽与醉人奶香。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于乳制品在烘焙制品中功能的叙述，下列哪些是正确的？
Ⅰ. 赋予浓郁纯正的天然奶香
Ⅱ. 乳糖促进烘烤着色与香气
Ⅲ. 乳脂乳蛋白增强制品柔软度与保湿性
Ⅳ. 牛奶在面团中能完全替代酵母产气", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "A", "explanation": "【考点解析】：动物淡奶油熔点低（约在 28℃~32℃），在高温环境下极易融化塌陷变形，必须冷藏保鲜，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ叙述完全正确。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "打发动物性淡奶油时，打蛋盆、打蛋头及淡奶油自身必须严格保持的最佳打发温度是：", "options": {"A": "30℃ ~ 40℃温热环境", "B": "4℃ ~ 8℃极低低温（隔冰水浴打发）", "C": "沸水100℃", "D": "零下20℃冻成坚硬冰块"}, "answer": "D", "explanation": "打发过度（Over-whipping）现象：脂肪球过度聚集破裂，游离液态油脂完全连接在一起，将包裹的水分全部排挤挤出，发生严重的“水油分离”。此时奶油结成粗硬豆腐渣，析出淡黄色黄油块和乳清水（即自制黄油过程），无法再用于抹面。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "在烘焙原料中，“炼乳（Condensed Milk）”与普通“蒸发乳/淡奶（Evaporated Milk）”的最核心区别在于：", "options": {"A": "炼乳额外添加了高达40%~45%的高浓度蔗糖，质地黏稠极甜", "B": "炼乳完全不含任何乳脂", "C": "淡奶是固体粉末", "D": "两者完全同一种原料"}, "answer": "B", "explanation": "UHT（Ultra-High Temperature）瞬时灭菌技术在极短时间内消灭所有致病菌和耐热芽孢，配合无菌利乐包装，无需添加任何防腐剂即可在常温密闭保存6~12个月；而巴氏鲜奶（72℃~75℃杀菌）保留了活性营养，但必须冷藏且保质期短（7~15天）。"}, {"id": 8, "type": "single", "question": "商业人造“植脂奶油（植物鲜奶油）”相较于天然动物性淡奶油，虽然塑形硬挺且成本低，但潜在健康隐患是：", "options": {"A": "含有工业氢化植物油，可能伴随反式脂肪酸且含较多人工香精添加剂", "B": "完全不含任何热量", "C": "保质期仅有一小时", "D": "极易发生核裂变"}, "answer": "B", "explanation": "奶油奶酪（Cream Cheese）属于未经长期陈化成熟的新鲜软质干酪，乳脂含量高达33%以上，质地柔软细腻如奶油膏状，带有微酸自然的乳香，是重芝士、巴斯克和轻乳酪蛋糕无可替代的灵魂原料。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "在面包生产中添加全脂奶粉，对改善面团搅拌与成品品质的综合作用不包括：", "options": {"A": "增强面筋耐搅拌缓冲能力与保水性", "B": "增加面包细腻奶香与金黄上色", "C": "彻底消灭面团中的所有酵母菌停止发酵", "D": "延缓面包老化变硬"}, "answer": "C", "explanation": "马斯卡彭（Mascarpone）是意大利国宝级新鲜奶油乳酪，由高脂鲜奶油酸化凝结而成，脂肪含量高达70%~75%，质地极其细腻丝滑、乳香浓郁厚重微甜，与意式浓缩咖啡、手指饼干和朗姆酒搭配，造就提拉米苏经典风味。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "若烘焙配方原本需要清水100g，烘焙师改用全脂纯牛奶完全等量替代，通常需要额外微调增加牛奶用量至约110g~114g，原因是：", "options": {"A": "牛奶中含有约12%~13%的乳固体（干物质），实际水分仅占约87%~88%", "B": "牛奶会吃掉面粉", "C": "牛奶在常温下会蒸发一半", "D": "电子秤称牛奶不准"}, "answer": "B", "explanation": "动物淡奶油打发全靠“冷藏温度”。当温度高于10℃时，微细脂肪球开始软化融解成液态油，无法形成支撑气泡的坚固骨架，打发极易失败或迅速化水塌陷。提前将奶油和打蛋盆冷藏（4℃~8℃），打发快且持久坚挺。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "制作意式经典甜点“提拉米苏（Tiramisu）”内馅核心慕斯糊时，不可替代的标志性高乳脂软奶酪是：", "options": {"A": "马斯卡彭奶酪（Mascarpone Cheese）", "B": "发酵硬质切达奶酪", "C": "酸涩的农家自制老豆腐", "D": "纯羊奶干酪"}, "answer": "D", "explanation": "牛奶是复杂多相分散体系：水是连续相，脂肪以微小脂肪球乳化悬浮（直径0.1~10微米），不溶性酪蛋白与胶体磷酸钙聚集成纳米级胶束（直径40~300纳米）。这些微粒的直径大于可见光波长，对光线产生强烈多向漫散射，呈现出柔和均匀的乳白色。"}, {"id": 12, "type": "single", "question": "在制作重油磅蛋糕或司康时，配方中加入适量浓稠酸奶或酸奶油（Sour Cream），其对质构的核心改良是：", "options": {"A": "天然微酸软化面筋骨架，赋予蛋糕极其湿润绵密、细腻不干噎的口感", "B": "让蛋糕体变成绿色", "C": "使蛋糕在出炉后硬如铁板", "D": "使蛋糕分解为液体"}, "answer": "B", "explanation": "奶粉提供浓郁奶香、乳糖上色和面筋强化缓冲，但奶粉中的乳蛋白不具备面筋蛋白的弹性延展网络结构，绝不可能代替面粉起筋；A、B、D都是烘焙中奶粉的无可争议的实用优势。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "新鲜牛奶中含有两大类核心蛋白质，其中占总蛋白约80%、遇酸容易凝结沉淀的蛋白质是：", "options": {"A": "酪蛋白（Casein）", "B": "乳清蛋白（Whey Protein）", "C": "角蛋白", "D": "麦胶蛋白"}, "answer": "A", "explanation": "【考点解析】：帕玛森硬质干酪（Parmesan）是陈年极干极硬的咸鲜干酪，富含天然谷氨酸鲜味，常磨碎撒于意大利面或焗烤菜上提香，绝非水分极高的甜点原料，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "市售纯动物黄油的制作工艺，本质上是将新鲜牛奶中的稀奶油经过高速离心物理搅打使：", "options": {"A": "乳脂肪球膜破裂相互聚集黏合，排尽乳清后得到的固态高纯度乳脂（含脂约82%）", "B": "蛋白质与化学试剂人工合成", "C": "矿物质与空气结合", "D": "纯植物油高温提炼"}, "answer": "D", "explanation": "黄金配比常识：全用纯牛奶做出的蛋挞馅口感偏单薄寡淡、容易出水出蜂窝孔；全用纯淡奶油又过于油腻糊口。将牛奶与淡奶油按科学比例调和，既有淡奶油的高乳脂奶香与丝滑凝冻感，又有牛奶的轻盈流动性，口感层次完美平衡。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "在制作低脂健康欧包或高蛋白软欧配方中，常选用的乳制品是：", "options": {"A": "脱脂奶粉（Skim Milk Powder）", "B": "高纯度人造起酥油", "C": "纯动物猪油", "D": "油炸坚果碎"}, "answer": "C", "explanation": "凝乳酶（Rennet，主成分为凝乳酶原Chymosin）是干酪制造关键酶。它特异性水解κ-酪蛋白特定肽键（Phe105-Met106），脱去带负电荷亲水性糖巨肽尾巴，破坏酪蛋白胶束表面负电排斥屏障，在钙离子参与下酪蛋白胶束迅速交联沉淀形成坚挺凝乳网，析出清亮乳清。"}, {"id": 16, "type": "single", "question": "意大利著名的“帕玛森干酪（Parmigiano-Reggiano）”，属于下列哪种奶酪类型？", "options": {"A": "特硬质陈年成熟熟奶酪（Hard Cheese）", "B": "未发酵新鲜软奶酪", "C": "液态乳清饮料", "D": "高水分发霉奶酪"}, "answer": "C", "explanation": "加糖炼乳是将鲜牛奶蒸发浓缩去除了约60%的水分，并添加了约40%~45%的蔗糖制成。质地极其黏稠厚重、甜度极高、乳香浓郁，由于高糖产生的高渗透压，炼乳在常温下即可长期储存，常用于制作葡式蛋挞、港式甜点和特浓面包。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "打发动物性淡奶油时，若由于打发时间过长或温度过高导致“油水分离”，挽救与补救原则是：", "options": {"A": "已经彻底发生相转变析出黄油粒与乳清，不可逆转无法再抹面，可继续打成黄油使用", "B": "倒入大量开水继续打发即可复原", "C": "放入冷冻室速冻三天恢复", "D": "倒在桌面上用吹风机吹干"}, "answer": "B", "explanation": "奶油奶酪严禁冷冻！奶油奶酪含水量较高，一旦冷冻，内部水分结成巨大粗糙冰晶刺破脂肪乳化结构；解冻后发生灾难性的油水分离，变成一盆粗糙碎烂、颗粒斑斑的豆腐渣，彻底丧失顺滑涂抹性，做芝士蛋糕极易颗粒沉底失败。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "在锅中煮热纯鲜牛奶时，牛奶表面常会迅速结出一层薄皮，其化学成分主要是：", "options": {"A": "受热脱水变性凝固的乳清蛋白、酪蛋白与脂肪复合膜", "B": "塑料包装纸融化物", "C": "纯人工色素", "D": "食盐结晶"}, "answer": "C", "explanation": "奶粉在烘焙中被称为“面团改良剂”：奶粉中富含钙、磷等矿物质与酪蛋白，具有优异的酸碱缓冲能力（防止面团在发酵后期酸度过高导致面筋软化破坏），能强化面筋弹性骨架，使面团耐搅拌、抗拉伸，烘烤出的面包体积更挺拔丰满。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "超市售卖的利乐砖无菌包装常温纯牛奶（保质期长达6个月），主要采用的灭菌工艺是：", "options": {"A": "超高温瞬时灭菌技术（UHT，约135℃~140℃维持数秒）", "B": "日晒紫外线自然暴晒三天", "C": "化学甲醛防腐剂浸泡", "D": "零下40度急冻"}, "answer": "A", "explanation": "牛乳蛋白分为酪蛋白（约80%）与乳清蛋白（约20%）。酪蛋白在pH 4.6（等电点）沉淀凝结，这正是酸奶、干酪生产的基石；酪蛋白热稳定性极好（耐受120℃以上不沉淀），而乳清蛋白（如β-乳球蛋白）在70℃以上即开始热变性。"}, {"id": 20, "type": "single", "question": "烤制经典意式披萨（Pizza）时，能在高温烘烤融化后拉出极其诱人长丝的标志性奶酪是：", "options": {"A": "马苏里拉奶酪（Mozzarella Cheese）", "B": "硬质帕玛森干酪", "C": "法式蓝纹奶酪", "D": "酸奶油"}, "answer": "D", "explanation": "鲜奶发酸并出现棉絮凝块是微生物（如乳酸菌、大肠杆菌、假单胞菌）疯狂增殖产酸、导致酪蛋白沉淀的典型变质表征。变质牛奶极易伴随致病菌和毒素滋生，食用会引发急性细菌性肠胃炎，严禁食用或掩盖使用。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "制作乳酪蛋糕时加入酸奶油（Sour Cream），其生产原理是向淡奶油中接入：", "options": {"A": "乳酸菌（Lactic Acid Bacteria）经恒温发酵产酸凝乳", "B": "工业强盐酸直接酸化", "C": "大量的食用白醋浸泡", "D": "高浓度小苏打"}, "answer": "A", "explanation": "【考点解析】：乳制品赋予的是湿润、醇香与松软口感，绝不会导致成品变干硬发苦，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ准确概括了牛奶乳成分在烘焙中的三大核心价值。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "在奶酪制作过程中，将酪蛋白凝结为固体凝乳后分离出的淡黄色半透明液体被称为：", "options": {"A": "乳清（Whey）", "B": "纯乳脂", "C": "起酥油", "D": "酪蛋白胶粒"}, "answer": "A", "explanation": "常温纯牛奶（无菌砖包装）未开封时常温保质半年，但一旦开盖，无菌环境瞬间打破，热带夏日高温（30℃以上）正是细菌繁殖的最适温区，短短数小时内细菌数量即可爆增数十万倍，半天即可发酸变质发臭。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "动物性新鲜淡奶油在日常后厨储存中必须严格冷藏（2℃~6℃），绝对禁止放入冷冻室（-18℃），原因是：", "options": {"A": "冷冻形成尖锐大冰晶破坏微细乳脂肪球膜，解冻后严重油水分离，彻底失去打发功能", "B": "冷冻会使淡奶油自发爆炸", "C": "冷冻会导致淡奶油变成有毒物质", "D": "淡奶油在零度以下会自发燃烧"}, "answer": "D", "explanation": "全脂奶粉含脂率约26%~28%，脂肪易受空气氧化酸败，保质期约1年；脱脂奶粉预先将绝大部分乳脂离心脱除（含脂率≤1.5%），富含酪蛋白（约34%~36%）和乳糖（约50%），耐氧化、保质期长（可达2~3年），广泛用于面包生产强化面筋与上色。"}, {"id": 24, "type": "single", "question": "意大利著名的新鲜“里科塔奶酪（Ricotta Cheese）”，其原料主要是利用制作其他奶酪剩下的：", "options": {"A": "乳清（Whey）再次加热回收凝固的乳清蛋白制成", "B": "纯大豆榨油残渣", "C": "全麦面粉麸皮", "D": "牛骨粉末"}, "answer": "B", "explanation": "烘焙经典组合：卡士达酱（Custard/Pastry Cream）醇厚浓稠、蛋香味浓，与打发的轻盈动物淡奶油（Chantilly）按比例轻柔折叠拌匀，即成为著名的外交官奶油（Diplomat Cream）。既有卡士达的浓醇柔润，又有淡奶油的轻柔云朵化口感，是法式泡芙和千层蛋糕的王牌夹心。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "在刚出炉的面包表皮趁热刷上一层纯鲜牛奶，所能达到的表皮感官改善是：", "options": {"A": "软化表皮，赋予哑光柔和质感与淡淡乳香", "B": "使表皮变成坚硬玻璃壳", "C": "使面包内部瞬间脱水", "D": "使表皮变绿"}, "answer": "C", "explanation": "传统酪乳（Buttermilk）是奶油打发制作黄油（Butter）时，破乳沉淀后留下的半透明带微酸乳液。其天然富含卵磷脂膜片段和乳酸，酸度适中，能中和小苏打产生细密气泡，并大幅软化面筋组织，使美式松饼和司康饼质地极其蓬松柔嫩。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "在制作传统硬质切达奶酪时，促使牛奶中的酪蛋白分子发生凝集生成坚实凝乳的关键天然酶是：", "options": {"A": "凝乳酶（Rennet / Chymosin）", "B": "淀粉水解酶", "C": "脂肪分解酶", "D": "麦芽糖转化酶"}, "answer": "A", "explanation": "乳制品（提供乳糖与乳蛋白）和糖是烘烤产生金黄美拉德褐变与焦糖化的物质基础，正常投放牛奶必然促进上色而非惨白；A、B、D都是导致成品惨白无色的真实工艺失误。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "经典美式红丝绒蛋糕（Red Velvet Cake）配方中要求使用酪乳（Buttermilk），其作用是：", "options": {"A": "提供天然乳酸与小苏打反应释放二氧化碳，软化面筋并使可可粉呈现鲜艳酒红天鹅绒质感", "B": "把蛋糕完全漂白成雪白色", "C": "使蛋糕在烤箱中不发生任何膨胀", "D": "消除所有糖味"}, "answer": "C", "explanation": "马苏里拉拉丝的核心秘诀：在乳酸菌发酵下，凝乳pH降至5.1~5.4时，胶体磷酸钙从酪蛋白胶束中部分解离（适当脱钙），酪蛋白亚基解聚形成平行链状纤维。在80℃热水中揉捏拉伸，分子链发生顺向定向排列，烘烤时受热融化便展现惊艳的超长弹力拉丝。"}, {"id": 28, "type": "single", "question": "在公制液体烘焙称量中，常温纯牛奶的平均相对密度约为：", "options": {"A": "约 1.028 ~ 1.032 g/ml（略重于水）", "B": "约 0.5 g/ml", "C": "约 2.0 g/ml", "D": "约 5.0 g/ml"}, "answer": "B", "explanation": "动物淡奶油的熔点约在 25℃~30℃ 之间。抹面环境若超过22℃，操作手温与室温会迅速融化奶油中支撑气泡的微细脂肪晶体骨架，奶油霜迅速变稀、出水挂浆、化水流淌，裱花花纹软塌模糊，因此专业西点房抹面必须在恒温冷气房中进行。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "法国著名的高级发酵奶酪“洛克福蓝纹奶酪（Roquefort）”，其独特大理石蓝绿花纹来源于：", "options": {"A": "人工注射的蓝绿色食用色素", "B": "洛克福青霉菌（Penicillium roqueforti）深层发酵成熟", "C": "铜锈污染沉淀", "D": "蓝莓果酱渗入"}, "answer": "A", "explanation": "【考点解析】：鲜牛奶中含有约 12% 固形物（乳糖、乳脂、乳蛋白），水分为 88% 左右，因此烘焙换算时 100g 牛奶通常约等价于 88g~90g 水，不能直接按 1:1 纯水粗糙等效，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ叙述准确。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "在制作高档生巧克力或甘纳许（Ganache）时，将煮沸的淡奶油冲入黑巧克力中，淡奶油的作用是：", "options": {"A": "提供水分与乳脂，在刮刀轻柔搅拌下形成极其顺滑、光泽细腻的油水乳化胶体", "B": "稀释巧克力使其无法凝固", "C": "中和巧克力的所有苦味", "D": "防止巧克力变甜"}, "answer": "B", "explanation": "芝士蛋糕的物理特性：刚出炉时中心温度高，奶油奶酪和黄油尚处于半液态软化状态，极其娇嫩脆弱。必须室温放凉后包保鲜膜放入冰箱彻底冷藏 4~6 小时以上，待乳脂完全结晶硬化定型，此时切块才能切出如大理石般光洁平整、棱角分明的完美切面。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "牛奶在面包面团发酵过程中，对发酵速度所表现出的物理缓冲调控作用是：", "options": {"A": "牛奶蛋白质具有优良的酸碱缓冲能力，减缓酸度急剧升高，使发酵更加温和稳定耐发", "B": "使面团瞬间产酸停止发酵", "C": "使酵母繁殖速度提高一千倍", "D": "完全杜绝任何气体产生"}, "answer": "A", "explanation": "经典烘焙生化考点：未经高温灭菌的生鲜奶中含有活性乳清蛋白（如含有还原性巯基-SH）。这些游离巯基会与小麦面筋中的二硫键发生交换断裂，极大地弱化面筋网络，使面团软塌发黏、持气性极差、烤出面包体积矮小。因此烘焙用鲜奶必须经过充分高温加热灭酶（或使用高温脱水奶粉）。"}, {"id": 32, "type": "single", "question": "在牛奶的微观物理乳化体系中，脂肪以极细小微粒悬浮在乳清中，防止脂肪聚集成块的关键结构是：", "options": {"A": "乳脂肪球膜（MFGM / Milk Fat Globule Membrane）", "B": "碳酸钙结晶壳", "C": "麦谷蛋白交联网", "D": "纤维素细胞壁"}, "answer": "D", "explanation": "动物淡奶油营养丰富极易染菌，且严禁冷冻（冷冻即水油分离油水分层报废）。规范做法是：封口处用酒精棉片擦净，排净盒内空气，用封口夹严密夹紧封口，存放在冰箱冷藏室内部稳定低温区（4℃~7℃），并在 3~5 天内尽快用完。", "difficulty": "easy"}, {"id": 33, "type": "single", "question": "针对“乳糖不耐受症（Lactose Intolerance）”人群研发的烘焙配方，应当选用的牛奶类型是：", "options": {"A": "添加了乳糖酶水解乳糖的“无乳糖牛奶（Zero Lactose Milk）”或植物燕麦奶", "B": "超高乳糖浓缩牛奶", "C": "生鲜未杀菌纯牛奶", "D": "高浓度炼乳"}, "answer": "C", "explanation": "开酥面团需要经受反复擀折压薄的严苛机械拉伸。脱脂奶粉中的酪蛋白和钙盐能够有效强化面筋网韧性，增加面皮弹性与柔顺延展度，防止在包裹黄油反复三折时面皮破裂漏油，保证千层层次清晰分明。", "difficulty": "easy"}, {"id": 34, "type": "single", "question": "烘焙奶粉在仓库储存中若吸收空气中水分导致“受潮结块”，从质量控制角度最直接的危害是：", "options": {"A": "粉质难以溶解拌匀，易产生颗粒结块，且水分活度升高易引发霉菌滋生与脂肪氧化", "B": "奶粉会在包装袋中自发燃烧", "C": "奶粉重量会减轻一半", "D": "蛋白质会自发消失"}, "answer": "A", "explanation": "炼乳与纯牛奶是两码事：炼乳含水量仅约 26%，含糖量高达 45%，且乳脂极浓；而纯牛奶含水量高达 88%，几乎无糖。1:1替换会导致面糊瞬间水分泛滥成水浆、严重缺乏甜度和乳脂支撑，成品必定扁平软塌、无味失败。", "difficulty": "easy"}, {"id": 35, "type": "single", "difficulty": "medium", "question": "在鲜奶油打发制作蛋糕抹面时，加入细砂糖的最适宜标准添加比例通常为淡奶油重量的：", "options": {"A": "约 6% ~ 8%（甜味恰到好处，不腻且有利于泡沫稳定）", "B": "约 50%", "C": "约 80%", "D": "0%"}, "answer": "D", "explanation": "固态脂肪含量（SFC）或固态脂肪指数（SFI）直接决定了乳脂的软硬度、塑性区间与涂抹融化性。例如黄油在10℃时SFI约50%（较硬），在20℃时SFI约20%（理想涂抹软化），在35℃时SFI降为0（完全融化清爽无渣）。"}, {"id": 36, "type": "single", "question": "南美洲传统特色浓郁甜点酱料“焦糖牛奶酱（Dulce de Leche）”，其核心制作机理是：", "options": {"A": "全脂牛奶与大量白糖经慢火长时间持续慢熬，发生强烈美拉德反应与焦糖化浓缩增稠", "B": "工业焦糖色素加清水勾芡", "C": "黑巧克力融化加水调配", "D": "食用碱面与牛奶剧烈中和"}, "answer": "C", "explanation": "酸奶发酵靠活性乳酸菌（嗜热链球菌与保加利亚乳杆菌）。活菌最适繁殖温度为 40℃~43℃；如果直接把菌粉倒入刚煮开的滚烫开水热奶中（>60℃），脆弱的益生菌会在数秒内被完全烫死灭活，牛奶无法产酸发酵，彻底报废。", "difficulty": "medium"}, {"id": 37, "type": "combination", "question": "在披萨或焗烤西点烘烤中，如果奶酪烘烤温度过高（如底火严重超标），奶酪容易出现的最严重缺陷是：", "options": {"A": "乳脂肪过度析出严重出油（Oiling-off），蛋白质焦枯硬脆失去拉丝弹性", "B": "奶酪变成透明液体水", "C": "奶酪完全不融化", "D": "奶酪体积膨大十倍"}, "answer": "D", "explanation": "【考点解析】：Ⅰ、Ⅱ、Ⅲ、Ⅳ皆正确！打发温度必须严控在 4℃ 左右；糖提高粘度稳泡；六七分发适合抹面；过度搅打必然导致乳状液破乳崩塌，析出水分变成黄油（Butter）与脱脂酪乳（Buttermilk）。", "difficulty": "medium"}, {"id": 38, "type": "single", "question": "评价动物淡奶油打发性能的重要技术指标“打发膨胀率（Overrun）”，是指：", "options": {"A": "打发后奶油体积增加量占原液体淡奶油体积的百分比（通常为80%~100%）", "B": "淡奶油中加入白糖的克数", "C": "打蛋器电机的旋转转速", "D": "打发时周围环境的温度数值"}, "answer": "A", "explanation": "鲜牛奶中88%是水，其余是乳糖、乳脂和乳蛋白。换成清水后水分总量基本一致，面筋和起泡结构依然正常成立，蛋糕依然能够成功膨胀；唯一区别是失去了乳糖的美拉德增色和乳脂肪的淡淡奶香，表皮颜色稍淡、香气稍减。", "difficulty": "medium"}, {"id": 39, "type": "single", "difficulty": "hard", "question": "在烘焙生产中，全脂奶粉相较于鲜牛奶在工业生产应用中的最大优势是：", "options": {"A": "含水量极低（<4%），保质期长易储运，便于标准化精准干拌称量投料", "B": "完全不需要添加任何水即可直接揉面", "C": "价格接近免费", "D": "能完全替代高筋面粉"}, "answer": "C", "explanation": "碱性磷酸酶（ALP）是巴氏杀菌法经典金标准指示酶：ALP的耐热性略高于牛奶中最耐热的无芽孢致病菌（如结核分枝杆菌和考克斯氏体）。如果检测出ALP呈阴性（彻底失活），即可确证该批鲜奶已达到足以杀灭全部常见致病菌的合格灭菌强度。"}, {"id": 40, "type": "single", "question": "在厨房中开封的鲜牛奶或淡奶油，若闻到发酸变质刺鼻异味且出现分层絮状沉淀，规范的处理措施是：", "options": {"A": "加大量香草精掩盖异味后继续烤蛋糕", "B": "加入小苏打中和酸味后继续使用", "C": "彻底丢弃，严禁投入任何食品生产，防止引发严重细菌性食物中毒", "D": "高温煮沸十分钟后作为饮用水饮用"}, "answer": "D", "explanation": "液体和软质乳制品（如淡奶油、酸奶、软奶酪）一旦肉眼看到表面长霉，肉眼难见的霉菌菌丝早已在液体中全面扩散渗透并释放出危险的真菌毒素。刮掉表面根本无济于事，绝不能为了节约小钱而诱发急性真菌毒素中毒，必须坚决彻底废弃。", "difficulty": "easy"}]}, {"chapter_id": 15, "chapter_title": "第15单元｜酵母与发酵 (Yeast & Fermentation)", "intro": "高一厨艺理论基础：认识新鲜酵母与干酵母、发酵温湿度、充气膨胀与酵母活性（生活常识版）", "questions": [{"id": 1, "type": "single", "question": "做面包溶解或激活干酵母粉时，倒入干酵母中最适宜的水温通常是：", "options": {"A": "5℃极度冰冷的冰水", "B": "100℃刚烧开的滚烫沸水", "C": "零度以下冰水", "D": "温热适宜的温水（约35℃~38℃）"}, "answer": "D", "explanation": "酵母是活的单细胞真菌。35℃~38℃温水能迅速唤醒休眠的干酵母细胞；若用超过55℃~60℃的沸水，酵母菌体内的蛋白质会变性凝固，活菌在几秒内被彻底烫死灭活，面团永远无法发酵。", "difficulty": "easy"}, {"id": 2, "type": "single", "question": "做面包时如果不小心误用了刚烧开的100℃滚烫沸水溶解干酵母，最直接的后果是：", "options": {"A": "酵母产气速度暴增五百倍", "B": "蛋白质变性产生有毒物质", "C": "面团变成水晶果冻", "D": "酵母菌被高温彻底烫死灭活，面团完全瘫软无法发酵"}, "answer": "D", "explanation": "酵母菌的耐热极限是 55℃~60℃。沸水（100℃）会瞬间烫死所有酵母细胞，使其彻底丧失代谢呼吸能力。揉好的面团毫无产气能力，在烤箱中烤出一块又死又硬的“面疙瘩死面块”。", "difficulty": "easy"}, {"id": 3, "type": "single", "difficulty": "medium", "question": "法式长棍面包（Baguette）入炉烘烤初期向烤箱喷射高压蒸汽的核心工艺机理是：", "options": {"A": "降低烤箱温度至50度以下", "B": "扑灭烤箱内的明火", "C": "在生坯表皮冷凝糊化淀粉延迟结壳，促进最大膨胀并形成薄脆外壳", "D": "吸干面包内部水分"}, "answer": "C", "explanation": "法式硬欧包蒸汽原理：蒸汽在相对较冷的面团表面瞬间冷凝成水膜，延缓表皮过早干燥结硬壳，使面团在烤箱起发（Oven Spring）中充分膨胀裂开漂亮刀口；同时蒸汽促使表皮淀粉糊化，出炉后形成薄如蝉翼、光亮金黄、酥脆可口的经典脆皮。"}, {"id": 4, "type": "single", "question": "在现代生物学分类体系中，烘焙所使用的酵母菌本质上属于下列哪一类微生物？", "options": {"A": "单细胞原核细菌", "B": "兼性厌氧的单细胞真核真菌（Fungi）", "C": "无细胞结构的病毒", "D": "多细胞肉眼可见的寄生虫"}, "answer": "B", "explanation": "酵母在厌氧和微氧条件下分解面团中的单糖，进行发酵反应生成二氧化碳（CO2）和乙醇（Alcohol）。CO2被坚韧的面筋网兜住形成无数蜂窝气孔使面包膨胀松软，乙醇和有机酸则赋予面包迷人的天然麦香发酵风味。", "difficulty": "easy"}, {"id": 5, "type": "combination", "question": "关于酵母在面包面团中发酵条件的叙述，下列哪些是正确的？
Ⅰ. 产生二氧化碳气体支撑面团膨胀多孔
Ⅱ. 代谢产生乙醇与多种芳香风味物质
Ⅲ. 在55℃~60℃以上温度会被迅速灭活致死
Ⅳ. 发酵时完全不需要任何水分与单糖", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅱ、Ⅲ、Ⅳ"}, "answer": "A", "explanation": "【考点解析】：酵母菌是单细胞真核微生物（真菌类），属于兼性厌氧菌，有氧环境下进行旺盛有氧呼吸快速增殖，无氧环境下进行发酵产生二氧化碳与酒精，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ准确阐述了酵母温度生理学。", "difficulty": "medium"}, {"id": 6, "type": "single", "question": "若烘焙配方中原需使用“即发高活性干酵母”5g，改用传统新鲜“压榨鲜酵母”，标准换算比例通常约为：", "options": {"A": "等量换算（即 5g 鲜酵母）", "B": "约 3 倍（即约 15g 鲜酵母，换算比约 3:1）", "C": "约 10 倍（即 50g 鲜酵母）", "D": "减半使用（即 2.5g 鲜酵母）"}, "answer": "B", "explanation": "高糖面团（糖量>7%~8%）周围产生巨大渗透压，会夺取普通酵母细胞水分抑制其发酵。耐高糖干酵母（通常为金色包装）具有适应高渗透压的特殊细胞膜与糖转化系统，在高糖环境下依然产气强劲。", "difficulty": "easy"}, {"id": 7, "type": "single", "difficulty": "medium", "question": "面包面团进行“基础发酵（一次发酵）”时，最适宜的标准环境温湿度通常为：", "options": {"A": "温度26℃~28℃，相对湿度约75%", "B": "温度45℃~50℃，相对湿度100%", "C": "温度0℃~4℃，相对湿度20%", "D": "温度80℃，完全无湿度"}, "answer": "D", "explanation": "酵母乙醇发酵的核心生化途径是 EMP途径（Embden-Meyerhof-Parnas Pathway）：1分子葡萄糖经一系列酶促反应降解为2分子丙酮酸并净生成2分子ATP；随后丙酮酸在丙酮酸脱羧酶作用下脱去CO2生成乙醛，乙醛再被乙醇脱氢酶还原为乙醇（酒精）。"}, {"id": 8, "type": "single", "question": "面包生坯成型后进入发酵箱进行“最后醒发（二次醒发）”时，标准环境温湿度通常为：", "options": {"A": "温度10℃~15℃，相对湿度30%", "B": "温度35℃~38℃，相对湿度80%~85%", "C": "温度60℃~70℃，相对湿度100%", "D": "温度0℃，相对湿度50%"}, "answer": "B", "explanation": "手指测试法（Finger Test）：食指沾少许高粉插入面团中心2~3厘米拔出。若指孔保持原样不回缩、不塌陷，且面团膨胀至初始的2~2.5倍大，内部呈细密蜂窝网状，代表发酵完美；若瞬间回缩代表发酵不足需继续发；若周围大面积塌陷软瘪代表发酵过度（发过头）。", "difficulty": "medium"}, {"id": 9, "type": "single", "question": "判断面团基础发酵是否达到最佳状态的经典实操检验手法是：", "options": {"A": "手指沾少许干面粉戳入面团中心拔出，孔洞不回缩、不塌陷，周围平稳保持原状", "B": "将面团丢入水中看是否沉底", "C": "用手掌用力拍打面团听声音", "D": "用刀切开看内部是否全熟"}, "answer": "C", "explanation": "发酵严重过度（发过头）：杂菌（乳酸菌、醋酸菌）疯狂繁殖产生大量有机酸，面团散发强烈酸馊酒气；酸性过高导致面筋网络软化水解断裂，无法兜住气体，面团像烂泥般瘫软塌陷；面团中糖分被酵母消耗殆尽，烤出的面包表皮惨白且口感酸涩发硬。", "difficulty": "easy"}, {"id": 10, "type": "single", "question": "根据烘焙百分比法则，某吐司配方面粉为1000g，即发干酵母用量通常为面粉的：", "options": {"A": "约 1% ~ 1.5%（即约 10g ~ 15g）", "B": "约 10%（即 100g）", "C": "约 0.01%（即 0.1g）", "D": "约 20%（即 200g）"}, "answer": "D", "explanation": "高浓度的盐具有极强的脱水杀菌作用。食盐与未被面粉稀释的干酵母直接堆叠接触，极高的局部渗透压会迅速杀死脆弱的酵母菌细胞，使酵母大幅失活。规范做法是：盐、糖与酵母分放于面粉两端，搅拌时借助干面粉缓冲阻隔。", "difficulty": "easy"}, {"id": 11, "type": "single", "difficulty": "hard", "question": "耐高糖高活性干酵母与普通低糖干酵母在配方应用上的分界线标准，通常以配方含糖量达到面粉的：", "options": {"A": "约 1% 为界", "B": "约 7% ~ 8% 为分界线（含糖>8%必须选用耐高糖酵母）", "C": "约 30% 为界", "D": "完全无区分"}, "answer": "C", "explanation": "冷冻面团技术瓶颈在于酵母存活率。缓慢冷冻会导致细胞内外自由水形成巨大尖锐冰晶刺破酵母细胞膜，解冻后酵母死亡产气骤降；必须采用-35℃~-40℃超低温强风速冻，使水分子以极快速度跨过最大冰晶生成带形成细小无害结晶，保存活菌率在85%以上。"}, {"id": 12, "type": "single", "question": "酵母菌在无氧环境下将面团中的葡萄糖水解发酵，释放出的两大核心代谢产物是：", "options": {"A": "二氧化碳（CO2，膨胀气孔）与乙醇（酒精，芳香风味）", "B": "纯氧气与纯自来水", "C": "高浓度硫酸与纯氢气", "D": "焦糖色素与纯油脂"}, "answer": "C", "explanation": "轻拍排气（Degassing/Punching down）：排出过度膨胀发酸的粗大气泡，将大空洞打碎为无数微细小气室；同时引入新鲜空气（氧气），激活酵母菌的新陈代谢，使最后发酵膨胀更均匀，烤出的面包组织如云朵般细腻无大空洞。", "difficulty": "easy"}, {"id": 13, "type": "combination", "question": "在面团调制中，配方中加入适量食盐（约1.5%~2%）对酵母发酵的最主要调控作用是：", "options": {"A": "利用适度高渗透压调控并抑制酵母过度发酵，防止面团发酸软瘫", "B": "刺激酵母产气速度暴增十倍", "C": "完全消灭面团中的所有酵母", "D": "提供高热量营养"}, "answer": "A", "explanation": "【考点解析】：高耐糖酵母是针对高渗透压糖环境驯化的菌株，在无糖或超低糖面团（如法棍）中反而表现出适应迟缓、产气速度较慢，低糖面团应选用低糖专用干酵母，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ换算比例准确。", "difficulty": "medium"}, {"id": 14, "type": "single", "question": "在基础发酵进行到约三分之二阶段时，对大面团进行轻柔折叠拍打“翻面（Punch Down）”，核心工艺目的是：", "options": {"A": "排出老废二氧化碳、引入新鲜氧气并均衡面团内部温湿度，强化面筋骨架", "B": "彻底破坏面团中的面筋网", "C": "把面团中的酵母全部拍死", "D": "使面团降温至冰点"}, "answer": "C", "explanation": "盐在烘焙中是“刹车片与骨架强化剂”：适量的盐产生适度渗透压，温和抑制酵母菌防止其狂躁发酵产酸；同时盐离子与面筋蛋白结合强化盐键骨架，使面筋坚韧紧致不瘫软，面团弹性与操作耐受力大幅增强。", "difficulty": "easy"}, {"id": 15, "type": "single", "difficulty": "hard", "question": "在温度对酵母代谢活性的影响曲线中，酵母菌在多少摄氏度以上会被迅速灭活致死？", "options": {"A": "约 20℃", "B": "约 55℃ ~ 60℃ 以上", "C": "约 38℃", "D": "必须达到300℃"}, "answer": "B", "explanation": "天然酵母酸面团（Sourdough）是野生酵母与乳酸菌（如旧金山乳杆菌Fructilactobacillus sanfranciscensis）的经典共生：乳酸菌偏好麦芽糖并不消耗果糖，野生酵母消耗葡萄糖和果糖互不抢食；乳酸菌代谢产生乳酸与醋酸赋予独特风味，降低面团pH值增强防腐力与面筋延展度。"}, {"id": 16, "type": "single", "question": "现代高档欧包常采用“低温冷藏长时间慢发酵（4℃~6℃冷藏12~24小时）”，相较于高温快发，核心优势是：", "options": {"A": "酶有充沛时间分解淀粉释放麦芽糖与有机酸，烘焙风味极其醇厚浓郁且面筋水合充分", "B": "完全不需要添加任何水分", "C": "烘烤时间缩短至一分钟", "D": "成本节约十倍"}, "answer": "D", "explanation": "二次醒发标准环境：35℃~38℃（略高于一发，促使酵母全力冲刺产气，但不能超过40℃避免黄油融化跑油）；湿度75%~85%（保持面团表皮柔软湿润不结硬皮，否则烘烤时表皮硬化阻碍面团长高开裂）。", "difficulty": "easy"}, {"id": 17, "type": "single", "question": "面包面团若在高温高湿环境中发酵时间严重超标导致“发酵过度（发过头）”，成品的典型瑕疵是：", "options": {"A": "面团产生强烈酸味，出炉后表皮苍白无光泽、中心塌陷且组织粗糙干硬", "B": "面包变成坚硬如铁的脆饼", "C": "内部充满大量奶油", "D": "表皮呈现鲜艳亮绿色"}, "answer": "B", "explanation": "面团表皮一旦接触干燥空气，水分迅速蒸发结成硬干壳（Crusting）。进烤箱后硬壳失去延展弹性，阻碍面团内部气体膨胀，导致面包体积矮小、烘烤时表皮撕裂破口粗糙，出炉后表皮又干又厚如同老树皮。", "difficulty": "easy"}, {"id": 18, "type": "single", "question": "面包面团若在基础发酵中未达标准膨胀度便匆忙烘烤（发酵不足），出炉成品的直观缺陷通常是：", "options": {"A": "体积矮小僵硬、组织致密紧实发死、表皮开裂不规则且口感沉重黏牙", "B": "体积过大炸裂", "C": "组织如海绵蛋糕轻盈入口即化", "D": "散发浓烈酒精香气"}, "answer": "C", "explanation": "酵母活力自检法：在小半碗35℃~38℃温水中加入一小勺细砂糖溶化，撒入半茶匙干酵母轻轻拌匀静置5~10分钟。若酵母具有活性，会迅速摄取糖分发酵，碗面会浮起一层厚厚如卡布奇诺奶沫般细腻活跃的气泡并伴有麦香；若水面平如死水毫无动静，证明酵母已完全死绝失效，应立即弃用换新。", "difficulty": "easy"}, {"id": 19, "type": "single", "difficulty": "medium", "question": "在传统欧包制作中，“老面法（Pâte Fermentée / 法式老面）”是指在主面团中加入：", "options": {"A": "前一天制作并经过充分发酵成熟的旧面团", "B": "发霉变质的面团废料", "C": "大量未经搅拌的干面粉", "D": "煮熟的面条"}, "answer": "D", "explanation": "流变发酵仪（Rheofermentometer，又称发酵流变仪）：测定面团发酵全过程的高度变化曲线、CO2产气曲线及面筋漏气释放临界时间点Tx。通过该曲线可精准评估面粉和酵母匹配度、面筋持气性能及最佳烘烤入炉发酵时间点。"}, {"id": 20, "type": "single", "question": "工业压榨新鲜“鲜酵母（Fresh Yeast）”在后厨中的标准储存规范是：", "options": {"A": "密封置于 0℃ ~ 4℃ 专用冷藏室冷藏，保质期通常为3~4周", "B": "敞口放置在常温烤箱旁", "C": "浸泡在沸腾开水中", "D": "暴晒在户外阳光下"}, "answer": "B", "explanation": "家庭自制发酵箱巧思：烤箱或微波炉内腔密封性好，放入一碗冒蒸汽的热开水（约60℃~80℃），水汽自然蒸发释放温和热量并提供充足湿度，内部温度维持在舒适的 28℃~32℃、湿度75%以上，能营造安全理想的发酵温湿度小环境。", "difficulty": "easy"}, {"id": 21, "type": "combination", "question": "酵母菌在面团中进行正常酶解呼吸与发酵产气的最适pH环境通常处于：", "options": {"A": "微酸性环境（pH 4.0 ~ 6.0）", "B": "强碱性环境（pH 12.0以上）", "C": "强酸性环境（pH 1.0以下）", "D": "完全无任何pH值"}, "answer": "A", "explanation": "【考点解析】：生物发酵与化学发泡机理截然不同，泡打粉无法使面团熟化生香并延展面筋，直接用泡打粉做面包会导致成品充满涩口碱味且无面包拉丝质地，绝不可相互替代，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ正确。", "difficulty": "medium"}, {"id": 22, "type": "single", "question": "制作传统无糖法式硬欧包时配方完全不加白糖，酵母菌在发酵中赖以生存的能量来源主要依靠：", "options": {"A": "面粉中自带的淀粉在淀粉酶水解下持续转化释放出的麦芽糖和葡萄糖", "B": "面团中添加的水分", "C": "空气中的氧气", "D": "酵母自带的微量脂肪"}, "answer": "A", "explanation": "无糖法包的生化奥秘：面粉自身含有约 70% 的淀粉，并天然含有微量游离淀粉酶（α-和β-淀粉酶）。加水揉面后，淀粉酶水解破损淀粉产生麦芽糖和游离糖，源源不断为酵母提供“粮食”，维持长达数小时的平稳发酵。", "difficulty": "easy"}, {"id": 23, "type": "single", "difficulty": "hard", "question": "面包面坯入炉烘烤的前5~10分钟内，体积会发生急剧爆发性膨胀，该现象在烘焙中称为：", "options": {"A": "烤箱急胀爆发期（Oven Spring）", "B": "蛋白质水解期", "C": "油脂氧化期", "D": "消泡塌陷期"}, "answer": "C", "explanation": "降落数值（Falling Number，FN）：以搅拌棒在热面粉糊中因重力下落特定距离所需的秒数表示。若小麦收割前遇雨发芽，内源性α-淀粉酶活性暴增，面粉糊被极速水解稀释，搅拌棒迅速落底，FN数值极低（<150秒），做面包内部发黏黏牙塌陷；理想面包粉FN在250~300秒之间。"}, {"id": 24, "type": "single", "question": "制作柔软拉丝吐司著名的“汤种法（烫种法）”，是将部分面粉与水加热至约65℃，核心机理是：", "options": {"A": "使淀粉预先糊化锁住大量水分，提高面团整体含水量并显著延缓面包老化", "B": "把面粉彻底烤焦", "C": "杀死面团中的所有酵母菌", "D": "让面粉变成透明果冻"}, "answer": "B", "explanation": "面筋松弛（Resting/Relaxation）常识：面团在经过分割、揉圆后，蛋白质内部分子链处于极度紧绷蓄力状态，弹性极高、延展性极低。强行擀开会撕裂面筋；只需盖好静置松弛（中间醒发/Bench Rest）10~15分钟，内应力自然释放消解，面团变得柔顺顺从，便能轻松顺畅地擀长擀薄。", "difficulty": "easy"}, {"id": 25, "type": "single", "question": "工业冷冻面团技术中，生面团在零下18℃长期冷冻储存过程中，酵母细胞的主要生理状态变化是：", "options": {"A": "生命代谢受低温抑制进入休眠，但随着冷冻时间延长细胞死亡率逐渐上升、发酵力下降", "B": "酵母在冷冻中繁殖速度加快十倍", "C": "酵母自发转化为淀粉", "D": "冷冻导致酵母发生核变"}, "answer": "D", "explanation": "割包（Scoring/Slashing）是欧包的艺术与科学：入炉后酵母在死前剧烈冲刺膨胀产气（Oven Spring），表皮划开斜刀口为气体提供了宣泄泄压通道，面包沿刀口整齐爆裂绽放，形成饱满高耸的经典麦穗耳裂（Ears）；若不割口，气体会在底部或侧面脆弱处随意爆裂炸膛破相。", "difficulty": "medium"}, {"id": 26, "type": "single", "question": "做面包时若因称量失误导致干酵母用量超标三倍，出炉面包最严重的感官缺陷是：", "options": {"A": "发酵过速导致气孔粗大不均极易塌陷，且出炉后带有极其浓烈刺鼻的“生酵母味”", "B": "面包完全不发酵像死面", "C": "面包变成石头般坚硬", "D": "面包甜度大幅增加"}, "answer": "B", "explanation": "酵母是面团产气的发动机。用量过低产气迟缓，若环境不够温暖，面团需要数倍时间才能勉强膨胀；而长时间暴露极易被杂菌（酸败乳酸菌）抢占先机，导致发酸变馊，且表皮易风干开裂，入炉后无力膨胀长高。", "difficulty": "easy"}, {"id": 27, "type": "single", "difficulty": "hard", "question": "在面团配方中，适量砂糖（面粉重量的3%~5%）加入面团对发酵速度所起的调控作用是：", "options": {"A": "直接为酵母提供快速代谢利用的单糖，缩短发酵前期启动时间", "B": "彻底杀灭酵母", "C": "阻止面筋吸收水分", "D": "使面团完全不上色"}, "answer": "A", "explanation": "克拉布特里效应（Crabtree Effect/葡萄糖效应）：即使在好氧条件下，若培养基糖浓度过高（>0.1%），酵母呼吸酶系依然受阻，转向产生酒精而不是增殖菌体。工业酵母制造采用高溶氧并以微细“流加糖蜜（Fed-batch）”使糖浓度极低，引导完全呼吸代谢，获得最高菌体产率。"}, {"id": 28, "type": "single", "question": "在烘焙用水水质分析中，最适宜用来调制面包面团的水质通常是：", "options": {"A": "中度硬水（含适量钙镁矿物质，滋养酵母并强韧面筋）", "B": "极度纯净蒸馏水（过软易发黏）", "C": "超高硬度苦咸水（过硬阻碍发酵）", "D": "含高浓度氯气的池塘污水"}, "answer": "D", "explanation": "干酵母最怕两大杀手：“空气中的水分（受潮激活后无粮食饿死）”与“高温光照（加速失活）”。开封后排出空气夹紧袋口，放入密封保鲜盒密封，存入冰箱冷藏室（0℃~4℃）或冷冻室，通常可维持数月强劲发酵活性。", "difficulty": "medium"}, {"id": 29, "type": "combination", "question": "法国面包制作大师常用的“面粉自解法（Autolyse）”，其规范操作流程是：", "options": {"A": "先将配方中的面粉和水低速混合成粗糙面团静置20~45分钟，暂不加酵母和盐", "B": "将面粉与酵母高温加热干炒", "C": "向面团中倒入高浓度白醋浸泡", "D": "面团直接放入开水中煮沸"}, "answer": "A", "explanation": "【考点解析】：未经最后醒发（二发）直接进炉的面坯内部缺乏充足气体，烘烤后必然严重死硬紧密、体积低矮如同面疙瘩，故Ⅳ错误；Ⅰ、Ⅱ、Ⅲ是经典面包发酵三部曲。", "difficulty": "medium"}, {"id": 30, "type": "single", "question": "发酵箱在醒发过程中提供恒定温湿度的必要性在于防止面团表面：", "options": {"A": "失水风干形成坚硬干燥硬皮，限制后续烘烤膨胀并导致表皮厚韧死硬", "B": "表面结厚冰块", "C": "面团融化成液体流失", "D": "产生大量酒精气味"}, "answer": "A", "explanation": "二发过度后果：气孔壁被撑得过薄失去支撑弹性骨架，入炉受热瞬间顶破气囊泄气；出炉遇到冷空气因无内部骨架支撑而发生灾难性的“大缩水塌腰（Collapse）”；同时残糖被耗尽导致表皮苍白，内部散发酵母死菌发馊酸味，组织空洞粗糙掉屑。", "difficulty": "easy"}, {"id": 31, "type": "single", "difficulty": "medium", "question": "烘焙欧包中著名的“波兰种（Poolish / 液体酵头）”，其标准的水粉调制比例是：", "options": {"A": "面粉与水按 1 : 1 等重量混合，加入微量即发干酵母搅拌发酵", "B": "面粉100g搭配水10g的干硬团", "C": "完全不加水纯面粉", "D": "加入90%纯植物油"}, "answer": "D", "explanation": "乔利伍德面包法（CBP）是现代工业面包的革命性工艺：通过超大功率闭式搅拌机（投入约40焦耳/克面团的超高机械能），在短短3~5分钟内强行将面筋拉伸熟化，配合抗坏血酸（维生素C，氧化剂强化二硫键），完全跳过耗时数小时的传统基础发酵，从配料到成品仅需约2小时。"}, {"id": 32, "type": "single", "question": "酵母菌在面包发酵过程中将葡萄糖代谢分解为乙醇和二氧化碳的生化反应过程属于：", "options": {"A": "酒精发酵（Alcoholic Fermentation）", "B": "醋酸发酵", "C": "乳酸发酵", "D": "完全有氧光合自养"}, "answer": "C", "explanation": "手粉使用规范：高水份面团口感更柔嫩湿润。黏手时手指轻沾微量手粉（防粘干粉）或薄油即可，若盲目倒入大量干粉揉入面团，会严重稀释吸收面团水分，使水粉比失衡，烤出的面包干硬死板丧失松软品质。", "difficulty": "easy"},
